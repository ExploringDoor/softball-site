<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Offline — DVSL</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#002D72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DVSL">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <!-- League config (must load before any page script) -->
  <script src="/config.js"></script>
  <style>
    :root { --navy:#002D72; --red:#D50032; --ink:#111; --muted:#667; }
    * { box-sizing:border-box; }
    html,body { margin:0; padding:0; height:100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #f7f8fb 0%, #eef1f7 100%);
      color: var(--ink);
      display:flex; align-items:center; justify-content:center;
      padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%;
      background: #fff;
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
      text-align: center;
    }
    .logo {
      width: 72px; height: 72px;
      border-radius: 16px;
      background: var(--navy);
      color: #fff;
      display:inline-flex; align-items:center; justify-content:center;
      font-weight: 800; font-size: 22px; letter-spacing: 1px;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; color: var(--navy); }
    p  { margin: 6px 0; color: var(--muted); line-height: 1.45; }
    .links { margin-top: 22px; display:flex; flex-direction:column; gap:10px; }
    .links a {
      display:block; padding: 12px 14px;
      background: var(--navy); color:#fff;
      border-radius: 10px; text-decoration:none; font-weight:600;
    }
    .links a.secondary {
      background:#fff; color:var(--navy);
      border:1px solid #d6dce8;
    }
    .retry {
      margin-top: 18px;
      background: var(--red); color:#fff;
      border:none; padding:12px 16px; border-radius: 10px;
      font-weight:700; font-size:15px; cursor:pointer;
      width: 100%;
    }
    .small { font-size: 12px; color:#8893a7; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">DVSL</div>
    <h1>You're offline</h1>
    <p>We can't reach the server right now.</p>
    <p>Pages you've visited before should still load. Live scores, captain tools, and admin need a connection.</p>

    <button class="retry" onclick="location.reload()">Try again</button>

    <div class="links">
      <a href="/">Home</a>
      <a href="/schedule.html" class="secondary">Schedule</a>
      <a href="/stats.html" class="secondary">Stats</a>
      <a href="/standings-history.html" class="secondary">Standings</a>
      <a href="/rules.html" class="secondary">Rules</a>
    </div>

    <div class="small">DVSL · Delaware Valley Synagogue League</div>
  </div>

  <script>
    // Auto-retry when the browser says we're back online
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
