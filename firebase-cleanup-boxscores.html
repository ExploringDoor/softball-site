<!DOCTYPE html>
<html>
<head>
<title>DVSL — Cleanup Fake Box Scores</title>
<style>
  body{font-family:monospace;background:#111;color:#eee;padding:32px;max-width:900px}
  h2{color:#f0c040}
  button{padding:10px 22px;margin:6px 4px;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-weight:700}
  .btn-find{background:#3b82f6;color:#fff}
  .btn-del{background:#ef4444;color:#fff}
  button:disabled{opacity:.35;cursor:not-allowed}
  pre{background:#000;padding:20px;border-radius:8px;max-height:500px;overflow:auto;font-size:12px;line-height:1.5}
  .ok{color:#4ade80} .warn{color:#f0c040} .err{color:#f87171} .info{color:#60a5fa}
  table{border-collapse:collapse;width:100%;margin:12px 0}
  th{background:#1e293b;padding:8px 10px;text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8}
  td{padding:7px 10px;border-bottom:1px solid #1e293b;font-size:13px}
  input{background:#1e293b;color:#eee;border:1px solid #334155;border-radius:4px;padding:6px 10px;font-size:14px;width:160px}
</style>
</head>
<body>
<h2>DVSL — Cleanup Fake Box Scores</h2>
<p style="color:#94a3b8;font-size:13px">Find and delete fake/test box scores by team or date.</p>

<div style="margin:16px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
  <label style="font-size:13px;color:#94a3b8">Team ID (e.g. tbir):</label>
  <input id="inp-team" type="text" placeholder="tbir" value="tbir">
  <label style="font-size:13px;color:#94a3b8">Date contains (optional):</label>
  <input id="inp-date" type="text" placeholder="May 14">
  <button class="btn-find" onclick="findBoxScores()">Find Matching Box Scores</button>
</div>

<div id="results-table"></div>
<button class="btn-del" id="btn-delete" onclick="deleteSelected()" disabled>Delete Selected</button>
<pre id="log"></pre>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import { getFirestore, collection, getDocs, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyDXuC-R0aPEX4F7lN5AKq48UC3r5whYzdg",
  authDomain: "dvsl-292dd.firebaseapp.com",
  projectId: "dvsl-292dd",
  storageBucket: "dvsl-292dd.firebasestorage.app",
  messagingSenderId: "145862305559",
  appId: "1:145862305559:web:153ec455bad57e17517952"
});
const db = getFirestore(app);

const logEl = document.getElementById('log');
function out(msg, cls='') {
  const line = document.createElement('span');
  if (cls) line.className = cls;
  line.textContent = msg + '\n';
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

let matchedDocs = [];

window.findBoxScores = async function() {
  logEl.innerHTML = '';
  matchedDocs = [];
  document.getElementById('btn-delete').disabled = true;
  document.getElementById('results-table').innerHTML = '';

  const teamFilter = document.getElementById('inp-team').value.trim().toLowerCase();
  const dateFilter = document.getElementById('inp-date').value.trim().toLowerCase();

  out('Reading box_scores...', 'info');
  try {
    const snap = await getDocs(collection(db, 'box_scores'));
    out(`Found ${snap.docs.length} total box scores.`, 'ok');

    matchedDocs = snap.docs.filter(d => {
      const data = d.data();
      const away = (data.away || '').toLowerCase();
      const home = (data.home || '').toLowerCase();
      const date = (data.date || '').toLowerCase();
      const teamMatch = !teamFilter || away === teamFilter || home === teamFilter;
      const dateMatch = !dateFilter || date.includes(dateFilter);
      return teamMatch && dateMatch;
    });

    if (matchedDocs.length === 0) {
      out('No matching box scores found.', 'warn');
      return;
    }

    out(`Found ${matchedDocs.length} matching box score(s):`, 'warn');

    let html = `<table><thead><tr>
      <th><input type="checkbox" id="chk-all" onchange="toggleAll(this)"> All</th>
      <th>Doc ID</th><th>Date</th><th>Away</th><th>Home</th><th>Status</th><th>Away Score</th><th>Home Score</th>
    </tr></thead><tbody>`;
    for (const d of matchedDocs) {
      const data = d.data();
      html += `<tr>
        <td><input type="checkbox" class="row-chk" data-id="${d.id}" checked></td>
        <td style="font-size:11px;color:#64748b">${d.id.slice(0,12)}…</td>
        <td>${data.date||'—'}</td>
        <td>${data.away||'—'}</td>
        <td>${data.home||'—'}</td>
        <td>${data.status||'—'}</td>
        <td>${data.away_score??'—'}</td>
        <td>${data.home_score??'—'}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    document.getElementById('results-table').innerHTML = html;
    document.getElementById('btn-delete').disabled = false;
  } catch(e) {
    out('ERROR: ' + e.message, 'err');
  }
};

window.toggleAll = function(cb) {
  document.querySelectorAll('.row-chk').forEach(c => c.checked = cb.checked);
};

window.deleteSelected = async function() {
  const checked = [...document.querySelectorAll('.row-chk:checked')].map(c => c.dataset.id);
  if (checked.length === 0) { out('Nothing selected.', 'warn'); return; }
  if (!confirm(`Delete ${checked.length} box score(s)? This cannot be undone.`)) return;
  document.getElementById('btn-delete').disabled = true;
  out(`Deleting ${checked.length} box score(s)...`, 'warn');
  try {
    for (const id of checked) {
      await deleteDoc(doc(db, 'box_scores', id));
      out(`Deleted ${id}`, 'ok');
    }
    out('Done! Refresh the site to see updated stats.', 'ok');
    document.getElementById('results-table').innerHTML = '';
    matchedDocs = [];
  } catch(e) {
    out('ERROR: ' + e.message, 'err');
    document.getElementById('btn-delete').disabled = false;
  }
};
</script>
</body>
</html>
