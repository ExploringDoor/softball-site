<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#002D72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DVSL">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script>
    // The old Player Portal (team-password gate, pick any name) is retired.
    // Everything it did lives in /profile.html behind Firebase Auth, so this
    // page always redirects. ?tab=<name> becomes /profile.html#<name>.
    (function(){
      var hash = '';
      try {
        var p = new URLSearchParams(location.search);
        var tab = (p.get('tab') || '').replace(/[^A-Za-z0-9_-]/g, '');
        hash = tab ? ('#' + tab) : (location.hash || '');
      } catch(_) {}
      location.replace('/profile.html' + hash);
    })();
  </script>
<title>DVSL Player Portal</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f6f8;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding:16px}
  a{color:#002D72;font-weight:600}
</style>
</head>
<body>
  <p>The Player Portal moved to <a href="/profile.html">My Profile</a>.</p>
</body>
</html>
