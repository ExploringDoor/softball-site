let existingPlayers = [];
let playersToAdd = [];

window.checkPlayers = async function(){
  log.textContent = '';
  out('Fetching existing players from Firebase...\n');
  try {
    const snap = await getDocs(collection(db, 'players'));
    existingPlayers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    out(`Found ${existingPlayers.length} existing players in Firebase.\n`);

    // Check which roster players are missing
    playersToAdd = ROSTERS.filter(rp => {
      return !existingPlayers.some(ep =>
        ep.name === rp.name && ep.team === rp.team
      );
    });

    // Group by team for display
    const teams = {};
    ROSTERS.forEach(rp => {
      if(!teams[rp.team]) teams[rp.team] = [];
      teams[rp.team].push(rp);
    });

    out('Rosters to upload:');
    Object.keys(teams).sort().forEach(t => {
      const existing = teams[t].filter(rp => existingPlayers.some(ep => ep.name === rp.name && ep.team === rp.team));
      const missing = teams[t].filter(rp => !existingPlayers.some(ep => ep.name === rp.name && ep.team === rp.team));
      out(`  ${t.toUpperCase()}: ${teams[t].length} total — ${existing.length} already exist, ${missing.length} to add`);
    });

    out('\n————————————————————————');
    if(playersToAdd.length === 0){
      out('\n✅ All roster players already in Firebase!');
    } else {
      out(`\n⚠️  ${playersToAdd.length} players to add across ${Object.keys(teams).length} teams.`);
      out('\nClick "Step 2" to upload them.');
      document.getElementById('addBtn').disabled = false;
    }
  } catch(e){
    out('ERROR: ' + e.message);
    console.error(e);
  }
};

window.addPlayers = async function(){
  if(!playersToAdd.length){ out('\nNothing to add.'); return; }
  document.getElementById('addBtn').disabled = true;
  out('\nUploading ' + playersToAdd.length + ' players...\n');

  let added = 0;
  let currentTeam = '';
  for(const p of playersToAdd){
    if(p.team !== currentTeam){
      currentTeam = p.team;
      out(`\n  ${currentTeam.toUpperCase()}:`);
    }
    try {
      await addDoc(collection(db, 'players'), p);
      out(`    ✅ ${p.name}${p.num ? ' #'+p.num : ''}${p.captain ? ' (C)' : ''}`);
      added++;
    } catch(e){
      out(`    ❌ ${p.name} — ${e.message}`);
    }
  }
  out(`\n════════════════════════`);
  out(`Done! Added ${added}/${playersToAdd.length} players.`);
  out('Refresh your site to see the rosters.');
};
