<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Watch Live — DVSL</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#002D72">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DVSL">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script>
    // SW registration + bottom tab bar + "More" sheet.
    //
    // The app-shell pattern: every page (fan or role) shares a single
    // bottom tab bar on mobile (≤767px). Tabs navigate — tapping Inbox
    // goes to /inbox.html; tapping More opens a bottom-sheet list of
    // secondary destinations. On desktop the tab bar is hidden and the
    // page's own hamburger is used. On mobile the hamburger is hidden.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(r => { try { r.update(); } catch(_){} }).catch(() => {});
        let _dvslReloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (_dvslReloaded) return;
          _dvslReloaded = true;
          window.location.reload();
        });
        navigator.serviceWorker.ready.then(r => {
          if (r.active) r.active.postMessage({ type: 'GET_VERSION' });
        }).catch(() => {});
        navigator.serviceWorker.addEventListener('message', (e) => {
          if (!e.data) return;
          if (e.data.type === 'VERSION' && typeof e.data.version === 'string') {
            // Only render the build tag on /rules.html, and only in the
            // normal document flow (not a fixed overlay). User wants a single
            // place to check which build is live without the chip cluttering
            // every page.
            if (location.pathname !== '/rules.html') return;
            let b = document.getElementById('dvsl-sw-version');
            if (!b) {
              b = document.createElement('div');
              b.id = 'dvsl-sw-version';
              b.style.cssText = 'text-align:center;padding:24px 0 8px;font:11px/1.2 ui-monospace,monospace;color:rgba(0,0,0,.35);user-select:none;';
              document.body.appendChild(b);
            }
            b.textContent = e.data.version;
          }
        });

        // ── Bottom tab bar + "More" sheet ─────────────────────────────
        const TABS = [
          { id: 'home',     label: 'Home',     icon: '🏠', href: '/#home' },
          { id: 'scores',   label: 'Scores',   icon: '🥎', href: '/#scores' },
          { id: 'schedule', label: 'Schedule', icon: '📅', href: '/#schedule' },
          { id: 'inbox',    label: 'Inbox',    icon: '🔔', href: '/inbox.html', badge: true },
          { id: 'more',     label: 'More',     icon: '⋯',  more: true },
        ];
        // Every secondary destination lives here. Grouped for scanning.
        // Add/remove items here only — nothing else to edit downstream.
        const MORE_GROUPS = [
          {
            label: 'Compete',
            items: [
              { icon: '🏆', label: 'Standings',   href: '/#standings' },
              { icon: '📊', label: 'Stats',       href: '/#stats' },
              { icon: '🥇', label: 'Leaders',     href: '/#leaders' },
              { icon: '🏅', label: 'Playoffs',    href: '/playoffs.html' },
              { icon: '📜', label: 'History',     href: '/#history' },
            ],
          },
          {
            label: 'Account',
            items: [
              { icon: '👤', label: 'Player Portal',     href: '/player.html' },
              { icon: '⚾', label: 'Captain Dashboard', href: '/captain.html' },
              { icon: '✍️', label: 'Player Sign-Up',    href: '/registration.html' },
              { icon: '🛠️', label: 'Admin Access',      href: '/admin.html' },
            ],
          },
          {
            label: 'Content',
            items: [
              { icon: '📸', label: 'Gallery',     href: '/photos.html' },
              { icon: '🎥', label: 'Watch Live',  href: '/watch.html' },
              { icon: '📋', label: 'Rules',       href: '/rules.html' },
            ],
          },
        ];

        // Figure out which tab (if any) is "active" for the current URL —
        // so the active tab gets highlighted on the bar.
        function _dvslCurrentTab() {
          const path = location.pathname.replace(/\/$/, '');
          const hash = location.hash || '';
          if (path === '/inbox.html') return 'inbox';
          // Fan index: / and /index.html both count
          if (path === '' || path === '/index.html') {
            if (hash.startsWith('#scores'))   return 'scores';
            if (hash.startsWith('#schedule')) return 'schedule';
            if (hash === '' || hash === '#' || hash.startsWith('#home')) return 'home';
          }
          return null; // other pages → nothing lit up
        }

        function _dvslEnsureTabBar() {
          if (document.getElementById('dvsl-tabbar')) return;
          // Scoped CSS block — injected once on first build. Keeps all of
          // the tab-bar presentation here so individual pages don't need to
          // touch their own stylesheets.
          if (!document.getElementById('dvsl-tabbar-css')) {
            const st = document.createElement('style');
            st.id = 'dvsl-tabbar-css';
            st.textContent = `
            /* Tab bar lives on a <nav>, and most fan pages have global
               "nav { position:fixed; top:48px; ... }" rules that would otherwise
               hijack this element. !important overrides force our intent to win
               without having to touch every page's stylesheet. */
            #dvsl-tabbar {
              position: fixed !important;
              top: auto !important;
              right: auto !important;
              left: 50% !important;
              bottom: 0 !important;
              transform: translateX(-50%) !important;
              width: 100% !important;
              max-width: 480px !important;
              /* Taller bar + extra padding-bottom beyond safe-area so icons
                 sit visibly higher off the physical bottom edge of the phone.
                 Adam said v32's 68px/6px pad change wasn't enough — icons still
                 felt like they were hugging the home-indicator. Here the inner
                 content area gets 8px of top pad AND 14px of pad below the
                 system safe-area, so icons float ~14px higher than before. */
              height: calc(74px + env(safe-area-inset-bottom)) !important;
              padding-top: 8px !important;
              padding-left: max(8px, env(safe-area-inset-left)) !important;
              padding-right: max(8px, env(safe-area-inset-right)) !important;
              padding-bottom: calc(env(safe-area-inset-bottom) + 14px) !important;
              margin: 0 !important;
              display: flex !important;
              align-items: stretch !important;
              justify-content: stretch !important;
              gap: 0 !important;
              background: #fff !important;
              border: 0 !important;
              border-top: 1px solid #e6e6e6 !important;
              backdrop-filter: none !important;
              -webkit-backdrop-filter: none !important;
              box-shadow: 0 -4px 16px rgba(0,0,0,.06) !important;
              z-index: 99995 !important;
              box-sizing: border-box !important;
              font: 600 10px/1.1 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Inter,sans-serif !important;
            }
            #dvsl-tabbar > * {
              flex: 1 1 0; min-width: 0;
              display: flex; flex-direction: column;
              align-items: center; justify-content: center;
              gap: 3px; padding: 4px 2px;
              background: transparent; border: 0;
              color: #8b8b8b; text-decoration: none; cursor: pointer;
              position: relative; -webkit-tap-highlight-color: transparent;
              overflow: visible;
              box-sizing: border-box;
              transition: color 160ms ease, transform 160ms ease;
            }
            /* Active tab: vivid blue, bolder label, STRONG glow on the icon.
               The old top-of-bar chip indicator has been removed — Adam said
               the line above the icon read awkwardly, and amping up the glow
               on the icon / label alone is a cleaner "this is where you are"
               cue. Triple layered box-less text-shadow gives the icon a halo
               without needing extra DOM. */
            #dvsl-tabbar > *.active { color: #0057ff; }
            #dvsl-tabbar > *.active .dt-ico {
              text-shadow:
                0 0 4px rgba(0,87,255,.95),
                0 0 12px rgba(0,87,255,.75),
                0 0 24px rgba(0,87,255,.55),
                0 0 40px rgba(0,87,255,.35);
              transform: translateY(-1px) scale(1.1);
            }
            #dvsl-tabbar > *.active .dt-label {
              font-weight: 900 !important;
              letter-spacing: .05em !important;
              color: #0046B4 !important;
              text-shadow: 0 0 6px rgba(0,70,180,.35);
            }
            #dvsl-tabbar .dt-ico {
              font-size: 20px; line-height: 1;
              transition: text-shadow 160ms ease, transform 160ms ease;
            }
            #dvsl-tabbar .dt-label {
              font: 700 9.5px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif !important;
              letter-spacing: 0; text-transform: uppercase;
              white-space: nowrap;
              overflow: visible !important;
              text-align: center;
            }
            #dvsl-tabbar .dt-badge {
              position: absolute; top: 4px; right: calc(50% - 20px);
              background: #e53935; color: #fff;
              min-width: 16px; height: 16px; padding: 0 4px;
              border-radius: 8px; font: 700 10px/16px system-ui,sans-serif;
              text-align: center; display: none;
              box-shadow: 0 1px 3px rgba(0,0,0,.3);
            }
            #dvsl-more-backdrop {
              position: fixed; inset: 0; z-index: 99996;
              background: rgba(0,0,0,.32);
              opacity: 0; transition: opacity 150ms; touch-action: none;
            }
            #dvsl-more-sheet {
              position: fixed; left: 50%; bottom: 0;
              transform: translate(-50%, 100%);
              transition: transform 220ms cubic-bezier(.2,.8,.2,1);
              width: 100%; max-width: 480px;
              max-height: 82vh; display: flex; flex-direction: column;
              background: #fff;
              border-radius: 18px 18px 0 0;
              box-shadow: 0 -12px 40px rgba(0,0,0,.25);
              z-index: 99997;
              overflow: hidden;
              font: 500 15px/1.35 system-ui,-apple-system,Segoe UI,Inter,sans-serif;
              color: #111;
            }
            #dvsl-more-sheet.open { transform: translate(-50%, 0); }
            #dvsl-more-grab {
              flex: 0 0 auto; padding: 10px 0 4px; display: flex; justify-content: center;
            }
            #dvsl-more-grab::before {
              content: ''; width: 42px; height: 4px; background: #d4d4d4; border-radius: 2px;
            }
            #dvsl-more-head {
              flex: 0 0 auto; display: flex; align-items: center;
              padding: 4px 16px 10px;
            }
            #dvsl-more-head h3 {
              margin: 0; flex: 1; font: 700 18px/1.2 system-ui,sans-serif; color: #111;
            }
            #dvsl-more-close {
              background: transparent; border: 0; font: 400 26px/1 system-ui,sans-serif;
              color: #8b8b8b; cursor: pointer; padding: 4px 8px; margin: -4px -8px;
            }
            #dvsl-more-list {
              flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
              -webkit-overflow-scrolling: touch;
              padding-bottom: calc(24px + env(safe-area-inset-bottom));
            }
            .dvsl-more-group-label {
              font: 700 11px/1 system-ui,sans-serif; color: #888;
              text-transform: uppercase; letter-spacing: .1em;
              padding: 16px 18px 6px;
            }
            .dvsl-more-row {
              display: flex; align-items: center; gap: 14px;
              padding: 14px 18px;
              color: #111; text-decoration: none;
              border-bottom: 1px solid #f3f3f3;
              -webkit-tap-highlight-color: rgba(0,45,114,.12);
            }
            .dvsl-more-row:active { background: #f5f7fb; }
            .dvsl-more-row .dmr-ico {
              flex: 0 0 auto; font-size: 22px; width: 28px; text-align: center;
            }
            .dvsl-more-row .dmr-lbl { flex: 1 1 auto; font-weight: 600; }
            .dvsl-more-row .dmr-chev { flex: 0 0 auto; color: #bbb; font-size: 18px; }
            /* Mobile-only display rules */
            @media (min-width: 768px) {
              #dvsl-tabbar { display: none !important; }
              body { padding-bottom: 0 !important; }
            }
            @media (max-width: 767px) {
              /* Hide the legacy hamburger on mobile — the tab bar replaces it. */
              .hamburger, #hbg, .menu-btn, .nav-toggle { display: none !important; }
            }
            `;
            document.head.appendChild(st);
          }

          const bar = document.createElement('nav');
          bar.id = 'dvsl-tabbar';
          bar.setAttribute('aria-label', 'Primary');
          const active = _dvslCurrentTab();
          TABS.forEach(t => {
            const el = t.more ? document.createElement('button') : document.createElement('a');
            el.dataset.tab = t.id;
            if (!t.more) { el.href = t.href; }
            if (t.id === active) el.classList.add('active');
            const ico = document.createElement('span'); ico.className = 'dt-ico'; ico.textContent = t.icon;
            const lbl = document.createElement('span'); lbl.className = 'dt-label'; lbl.textContent = t.label;
            el.appendChild(ico); el.appendChild(lbl);
            if (t.badge) {
              const bg = document.createElement('span');
              bg.className = 'dt-badge';
              bg.id = 'dvsl-tab-inbox-badge';
              el.appendChild(bg);
            }
            if (t.more) {
              el.type = 'button';
              el.setAttribute('aria-label', 'More destinations');
              el.addEventListener('click', (e) => { e.preventDefault(); _dvslOpenMore(); });
            }
            bar.appendChild(el);
          });
          document.body.appendChild(bar);

          // Keep the bar out of content. Padding is applied via JS so we can
          // respond to the media query without the CSS fighting page-level rules.
          _dvslApplyBodyPad();
        }

        function _dvslApplyBodyPad() {
          const mobile = window.matchMedia('(max-width: 767px)').matches;
          if (mobile) {
            // 74px bar + 8px top pad + 14px bottom pad + ~8px gap = 104px clearance.
            document.body.style.paddingBottom = 'calc(104px + env(safe-area-inset-bottom))';
          } else {
            document.body.style.paddingBottom = '';
          }
        }
        window.addEventListener('resize', _dvslApplyBodyPad);

        // Tab bar is built once at load, but the active-tab highlight
        // needs to react to client-side nav. Fan pages use location.hash
        // routing (goPage sets #scores / #schedule / #home etc.), and the
        // History API via goPage fires 'hashchange' or pushState which
        // doesn't, so we listen to both. User reported: tapping Scores /
        // Schedule kept Home glowing blue because this only ran at load.
        function _dvslSyncActiveTab() {
          const bar = document.getElementById('dvsl-tabbar');
          if (!bar) return;
          const active = _dvslCurrentTab();
          bar.querySelectorAll('[data-tab]').forEach(el => {
            if (el.dataset.tab === active) el.classList.add('active');
            else el.classList.remove('active');
          });
        }
        window.addEventListener('hashchange', _dvslSyncActiveTab);
        window.addEventListener('popstate', _dvslSyncActiveTab);
        // Also poll briefly after goPage-style navs (pushState doesn't fire
        // hashchange). Cheap enough — runs on any tab-bar click.
        document.addEventListener('click', (e) => {
          const a = e.target && e.target.closest && e.target.closest('#dvsl-tabbar [data-tab]');
          if (a) setTimeout(_dvslSyncActiveTab, 50);
        });

        // ── More sheet ────────────────────────────────────────────────
        let _dvslSavedScrollY = null;
        function _dvslLockBody() {
          if (_dvslSavedScrollY != null) return;
          _dvslSavedScrollY = window.scrollY || 0;
          document.body.style.position = 'fixed';
          document.body.style.top = '-' + _dvslSavedScrollY + 'px';
          document.body.style.left = '0';
          document.body.style.right = '0';
          document.body.style.width = '100%';
        }
        function _dvslUnlockBody() {
          if (_dvslSavedScrollY == null) return;
          const y = _dvslSavedScrollY;
          document.body.style.position = '';
          document.body.style.top = '';
          document.body.style.left = '';
          document.body.style.right = '';
          document.body.style.width = '';
          _dvslSavedScrollY = null;
          window.scrollTo(0, y);
        }

        function _dvslOpenMore() {
          if (document.getElementById('dvsl-more-sheet')) return;
          _dvslLockBody();
          const backdrop = document.createElement('div');
          backdrop.id = 'dvsl-more-backdrop';
          backdrop.addEventListener('click', _dvslCloseMore);
          document.body.appendChild(backdrop);

          const sheet = document.createElement('div');
          sheet.id = 'dvsl-more-sheet';
          sheet.setAttribute('role', 'dialog');
          sheet.setAttribute('aria-label', 'More destinations');
          let html = '<div id="dvsl-more-grab"></div>' +
            '<div id="dvsl-more-head"><h3>More</h3><button id="dvsl-more-close" aria-label="Close">×</button></div>' +
            '<div id="dvsl-more-list">';
          MORE_GROUPS.forEach(g => {
            html += '<div class="dvsl-more-group-label">' + g.label + '</div>';
            g.items.forEach(it => {
              const safeLabel = String(it.label).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
              html += '<a class="dvsl-more-row" href="' + it.href + '">' +
                '<span class="dmr-ico">' + it.icon + '</span>' +
                '<span class="dmr-lbl">' + safeLabel + '</span>' +
                '<span class="dmr-chev">›</span>' +
              '</a>';
            });
          });
          html += '</div>';
          sheet.innerHTML = html;
          document.body.appendChild(sheet);
          sheet.querySelector('#dvsl-more-close').addEventListener('click', _dvslCloseMore);
          // Close sheet on ANY row tap. For same-page hash routes (#standings,
          // #stats, etc.) the anchor only changes location.hash and doesn't
          // unload the page, so without this the sheet would stay mounted
          // covering the page the user just navigated to. Real-page hrefs
          // unload naturally; closing here is harmless in that case.
          sheet.querySelectorAll('.dvsl-more-row').forEach(row => {
            row.addEventListener('click', () => { _dvslCloseMore(); });
          });
          requestAnimationFrame(() => { backdrop.style.opacity = '1'; sheet.classList.add('open'); });
        }
        function _dvslCloseMore() {
          const b = document.getElementById('dvsl-more-backdrop');
          const s = document.getElementById('dvsl-more-sheet');
          if (s) s.classList.remove('open');
          if (b) b.style.opacity = '0';
          setTimeout(() => { if (s) s.remove(); if (b) b.remove(); _dvslUnlockBody(); }, 220);
        }

        // Build the tab bar on every page load (not just when a token exists —
        // non-subscribers still need navigation).
        _dvslEnsureTabBar();

        // ── Inbox badge polling (was the bell) ────────────────────────
        let _dvslLastCheck = 0;
        let _dvslLastCount = -1;

        async function _dvslCheckPendingNav() {
          const now = Date.now();
          if (now - _dvslLastCheck < 3000) return;
          _dvslLastCheck = now;
          const token = localStorage.getItem('dvsl-notif-token');
          if (!token) { _dvslSetBadge(0); return; }
          try {
            const resp = await fetch('/api/check-pending-nav', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token }),
            });
            if (!resp.ok) return;
            const data = await resp.json();
            const items = Array.isArray(data && data.items) ? data.items : [];
            _dvslSetBadge(items.length);
          } catch(_) {}
        }
        function _dvslSetBadge(count) {
          if (count === _dvslLastCount) return;
          _dvslLastCount = count;
          const el = document.getElementById('dvsl-tab-inbox-badge');
          if (!el) return;
          if (count > 0) {
            el.style.display = 'block';
            el.textContent = count > 99 ? '99+' : String(count);
          } else {
            el.style.display = 'none';
          }
        }

        _dvslCheckPendingNav();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') _dvslCheckPendingNav();
        });
        window.addEventListener('pageshow', _dvslCheckPendingNav);
        window.addEventListener('focus', _dvslCheckPendingNav);
        setInterval(() => {
          if (document.visibilityState === 'visible') _dvslCheckPendingNav();
        }, 5000);
      });
    }
  </script>

  <style>
    :root{
      --navy:#002D72; --red:#D50032; --ink:#111; --muted:#667;
      --line:#e5e8ef; --bg:#f5f7fb; --card:#fff;
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    a{ color:var(--navy); text-decoration:none; }

    /* ── header ─────────────────────────────────────── */
    header{
      background:var(--navy); color:#fff;
      padding: 14px 16px;
      display:flex; align-items:center; gap:12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
      position: sticky; top:0; z-index: 10;
    }
    header .title{ font-weight:800; letter-spacing:.5px; font-size:18px; }
    header .live-dot{
      display:inline-block; width:10px; height:10px; border-radius:50%;
      background: var(--red); margin-right:6px;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse{
      0%,100%{ opacity:1; transform:scale(1); }
      50%{ opacity:.4; transform:scale(1.25); }
    }
    header .back{
      background: rgba(255,255,255,.15); color:#fff;
      border: none; padding: 6px 12px; border-radius: 8px;
      font-size:14px; font-weight:600; cursor:pointer;
    }
    header .home-link{
      margin-left:auto; color:#fff; opacity:.95; font-size:14px;
      background: rgba(255,255,255,.15); padding: 6px 12px; border-radius: 8px;
      font-weight:600;
    }
    header .home-link:hover{ opacity:1; }

    .container{ max-width: 720px; margin: 0 auto; padding: 16px 12px 40px; }

    /* ── list of live games ─────────────────────────── */
    .section-title{
      font-size:13px; font-weight:700; letter-spacing:1.5px;
      color:var(--muted); margin: 6px 4px 10px; text-transform:uppercase;
    }
    .game-card{
      background:var(--card); border-radius:14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
      padding: 14px 16px; margin-bottom: 12px;
      display:flex; flex-direction:column; gap:10px;
      cursor:pointer; border:1px solid var(--line);
      transition: transform .08s ease;
    }
    .game-card:active{ transform:scale(.99); }
    .game-card .inning-row{
      display:flex; justify-content:space-between; align-items:center;
      font-size:12px; font-weight:700; text-transform:uppercase;
      letter-spacing:1px;
    }
    .game-card .live-badge{
      color:var(--red); display:inline-flex; align-items:center;
    }
    .game-card .team-row{
      display:flex; justify-content:space-between; align-items:center;
      padding: 2px 0;
    }
    .game-card .team{
      display:flex; align-items:center; gap:10px; flex:1; min-width:0;
    }
    .game-card .team img{
      width:34px; height:34px; border-radius:50%; object-fit:cover;
      background:#eef; flex-shrink:0;
    }
    .game-card .team-name{
      font-weight:700; font-size:16px; color:var(--ink);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .game-card .score{
      font-weight:900; font-size:26px; color:var(--ink); min-width:40px;
      text-align:right; font-variant-numeric: tabular-nums;
    }
    .game-card .score.batting{ color:var(--red); }

    .empty{
      background:var(--card); border-radius:14px; border:1px solid var(--line);
      padding: 40px 20px; text-align:center; color:var(--muted);
    }
    .empty h2{ color:var(--ink); font-size:18px; margin:0 0 6px; }
    .empty p{ margin:0 0 16px; font-size:14px; line-height:1.5; }
    .empty a{
      display:inline-block; background:var(--navy); color:#fff;
      padding: 10px 18px; border-radius:10px; font-weight:600;
    }

    /* ── detail view ────────────────────────────────── */
    #detail{ display:none; }
    .detail-hero{
      background: var(--navy); color:#fff;
      border-radius:16px; padding: 20px 16px 16px; margin-bottom:14px;
      box-shadow: 0 4px 16px rgba(0,45,114,.2);
    }
    .detail-hero .inning{
      text-align:center; font-size:12px; letter-spacing:2px;
      font-weight:700; text-transform:uppercase; opacity:.85;
      margin-bottom: 12px;
    }
    .detail-hero .score-row{
      display:flex; justify-content:space-around; align-items:center;
      padding: 8px 0 14px;
    }
    .detail-hero .side{
      flex:1; text-align:center;
    }
    .detail-hero .side img{
      width:56px; height:56px; border-radius:50%; object-fit:cover;
      background:rgba(255,255,255,.1); margin-bottom: 8px;
    }
    .detail-hero .side .short{
      font-size:13px; font-weight:600; opacity:.9; letter-spacing:1px;
    }
    .detail-hero .side .score{
      font-size:48px; font-weight:900; line-height:1;
      margin-top:4px; font-variant-numeric: tabular-nums;
    }
    .detail-hero .side.batting::after{
      content:"⚾"; font-size:11px; display:block; opacity:.8; margin-top:2px;
    }
    .detail-hero .vs{
      font-size:20px; font-weight:700; opacity:.6; padding: 0 6px;
    }

    .panel{
      background:var(--card); border:1px solid var(--line);
      border-radius:14px; padding: 14px; margin-bottom:12px;
    }
    .panel h3{
      margin: 0 0 10px; font-size:12px; letter-spacing:1.5px;
      text-transform:uppercase; color:var(--muted); font-weight:700;
    }

    /* batter / count / outs panel */
    .bc-grid{
      display:grid; grid-template-columns: 1fr auto; gap:12px; align-items:center;
    }
    .bc-batter .label{ font-size:11px; color:var(--muted); margin-bottom:2px; }
    .bc-batter .name{ font-weight:700; font-size:17px; color:var(--ink); }
    .bc-count{ text-align:right; }
    .bc-count .bs{ font-weight:800; font-size:22px; font-variant-numeric:tabular-nums; }
    .bc-count .outs{
      display:inline-flex; gap:3px; margin-top:4px;
    }
    .bc-count .out-dot{
      width:12px; height:12px; border-radius:50%;
      background:#ddd; border:1px solid #bbb;
    }
    .bc-count .out-dot.on{ background:var(--red); border-color:var(--red); }

    /* diamond for base runners */
    .diamond-wrap{ display:flex; justify-content:center; padding: 6px 0; }
    .diamond{
      position:relative; width: 180px; height: 180px;
    }
    .base{
      position:absolute; width:34px; height:34px; background:#fff;
      border:2px solid #999; transform: rotate(45deg);
    }
    .base.home{ left: 73px; top: 140px; background:#fff; }
    .base.first{ left: 140px; top: 73px; }
    .base.second{ left: 73px; top: 6px; }
    .base.third{ left: 6px; top: 73px; }
    .base.on{ background: var(--red); border-color: var(--red); box-shadow: 0 0 12px var(--red); }

    /* line score */
    .linescore{ overflow-x:auto; }
    .linescore table{
      width:100%; border-collapse: collapse; font-size:13px;
      font-variant-numeric: tabular-nums;
    }
    .linescore th, .linescore td{
      padding: 6px 4px; text-align:center; border-bottom:1px solid var(--line);
    }
    .linescore th:first-child, .linescore td:first-child{
      text-align:left; font-weight:700; padding-left: 8px; min-width: 60px;
    }
    .linescore .rhe{ font-weight:800; background:#fafbfd; }

    /* play log */
    .play-log{ max-height: 400px; overflow-y:auto; }
    .play{
      padding: 10px 0; border-bottom:1px solid var(--line);
      display:grid; grid-template-columns: auto 1fr; gap:10px;
    }
    .play:last-child{ border-bottom:none; }
    .play .inning-tag{
      font-size:11px; font-weight:700; color:var(--muted);
      letter-spacing:1px; text-transform:uppercase; white-space:nowrap;
      padding-top:2px;
    }
    .play .body{ font-size:14px; line-height:1.4; }
    .play .result{ font-weight:700; color:var(--navy); }
    .play .desc{ color:#444; }
    .play .sc{ display:inline-block; margin-left:6px; padding:1px 6px;
      background:#eef; color:var(--navy); border-radius:4px; font-size:12px;
      font-weight:700; font-variant-numeric:tabular-nums; }

    .updated{
      text-align:center; font-size:11px; color:var(--muted); margin-top:12px;
    }

    /* small */
    @media (max-width: 420px){
      .game-card .score{ font-size:22px; }
      .detail-hero .side .score{ font-size:40px; }
    }
  </style>
</head>
<body>
  <header>
    <button class="back" id="backBtn" style="display:none;" onclick="showList()">← Back</button>
    <div class="title"><span class="live-dot"></span>Watch Live</div>
    <a class="home-link" href="/">← DVSL Home</a>
  </header>

  <div class="container">
    <!-- list view -->
    <div id="list">
      <div class="section-title">Live now</div>
      <div id="live-games"></div>
    </div>

    <!-- detail view -->
    <div id="detail"></div>
  </div>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  getFirestore, collection, doc, getDocs, onSnapshot, query, where, Timestamp
} from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

const FB_CFG = {
  apiKey:"AIzaSyDXuC-R0aPEX4F7lN5AKq48UC3r5whYzdg",
  authDomain:"dvsl-292dd.firebaseapp.com",
  projectId:"dvsl-292dd",
  storageBucket:"dvsl-292dd.firebasestorage.app",
  messagingSenderId:"145862305559",
  appId:"1:145862305559:web:153ec455bad57e17517952"
};
const app = getApps().length ? getApp() : initializeApp(FB_CFG);
let db;
try {
  db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
} catch (e) { db = getFirestore(app); }

// ── state ─────────────────────────────────────────────
let currentGameId = null;
let gameListUnsub = null;
let gameDetailUnsub = null;
let gamesSnap = [];   // raw snap docs from current listen
let teamsCache = {};  // id -> team doc (for names/colors if needed)

// ── helpers ───────────────────────────────────────────
// Doc keys: either "<gameId>", "<gameId>_away", or "<gameId>_home".
// We group by base id, then pick the doc with the latest savedAt.
function baseId(key) {
  return key.replace(/_(away|home)$/, '');
}

function mergeGames(docs) {
  const groups = {};
  docs.forEach(d => {
    const gid = baseId(d.id);
    if (!groups[gid] || scoreNewer(d, groups[gid])) groups[gid] = d;
  });
  return Object.values(groups);
}
function scoreNewer(a, b) {
  const ta = a.data.savedAt?.seconds || a.data.savedAt?.toMillis?.() || 0;
  const tb = b.data.savedAt?.seconds || b.data.savedAt?.toMillis?.() || 0;
  return ta > tb;
}

function logoUrl(teamId) {
  if (!teamId) return '/logos/glove.png';
  return `/logos/${teamId.toLowerCase()}.svg`;
}
function onLogoError(img) {
  if (img.dataset.tried === 'png') { img.style.visibility='hidden'; return; }
  img.dataset.tried = 'png';
  img.src = img.src.replace(/\.svg$/, '.png');
}
window.onLogoError = onLogoError;

function inningLabel(g) {
  const half = (g.half || 'top').toLowerCase();
  const arrow = half === 'top' ? '▲' : '▼';
  return `${arrow} ${half === 'top' ? 'Top' : 'Bot'} ${g.inning || 1}`;
}
function battingSide(g) {
  return (g.half || 'top').toLowerCase() === 'top' ? 'away' : 'home';
}

// ── list view ─────────────────────────────────────────
function showList() {
  currentGameId = null;
  if (gameDetailUnsub) { gameDetailUnsub(); gameDetailUnsub = null; }
  document.getElementById('detail').style.display = 'none';
  document.getElementById('list').style.display = 'block';
  document.getElementById('backBtn').style.display = 'none';
}
window.showList = showList;

function subscribeList() {
  if (gameListUnsub) gameListUnsub();
  // Only listen for docs updated in the last 6 hours — server-side filter keeps
  // us from reading stale games every time anything in the collection changes.
  const sixHoursAgo = Timestamp.fromMillis(Date.now() - 6 * 60 * 60 * 1000);
  const col = collection(db, 'game_states');
  const q = query(col, where('savedAt', '>=', sixHoursAgo));
  gameListUnsub = onSnapshot(q, (snap) => {
    gamesSnap = [];
    snap.forEach(d => gamesSnap.push({ id: d.id, data: d.data() }));
    renderList();
  }, (err) => {
    console.warn('watch list error:', err);
    renderOffline();
  });
}

function renderList() {
  const el = document.getElementById('live-games');
  // Server-side where() already limits to docs updated in the last 6h.
  const merged = mergeGames(gamesSnap);
  if (!merged.length) {
    el.innerHTML = `
      <div class="empty">
        <h2>No games being scored right now</h2>
        <p>When a captain or the commissioner starts live-scoring a game, it'll appear here — refreshing in real time.</p>
        <a href="/">← Back to home</a>
      </div>`;
    return;
  }
  // Sort by savedAt desc
  merged.sort((a,b) => {
    const ta = a.data.savedAt?.seconds || a.data.savedAt?.toMillis?.() || 0;
    const tb = b.data.savedAt?.seconds || b.data.savedAt?.toMillis?.() || 0;
    return tb - ta;
  });
  el.innerHTML = merged.map(m => renderGameCard(baseId(m.id), m.data)).join('');
}

function renderGameCard(gid, g) {
  const away = g.awayTeam || {};
  const home = g.homeTeam || {};
  const battingIsAway = battingSide(g) === 'away';
  return `
    <div class="game-card" onclick="showDetail('${gid}')">
      <div class="inning-row">
        <span class="live-badge">● LIVE</span>
        <span>${inningLabel(g)}</span>
      </div>
      <div class="team-row">
        <div class="team">
          <img src="${logoUrl(away.id)}" alt="${away.short||''}" onerror="onLogoError(this)">
          <span class="team-name">${away.name || away.short || 'Away'}</span>
        </div>
        <div class="score ${battingIsAway?'batting':''}">${g.awayScore ?? 0}</div>
      </div>
      <div class="team-row">
        <div class="team">
          <img src="${logoUrl(home.id)}" alt="${home.short||''}" onerror="onLogoError(this)">
          <span class="team-name">${home.name || home.short || 'Home'}</span>
        </div>
        <div class="score ${!battingIsAway?'batting':''}">${g.homeScore ?? 0}</div>
      </div>
    </div>`;
}

function renderOffline() {
  document.getElementById('live-games').innerHTML = `
    <div class="empty">
      <h2>Can't reach live scores</h2>
      <p>You may be offline. We'll reconnect automatically.</p>
    </div>`;
}

// ── detail view ───────────────────────────────────────
function showDetail(gid) {
  currentGameId = gid;
  document.getElementById('list').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  document.getElementById('backBtn').style.display = 'inline-block';
  subscribeDetail(gid);
}
window.showDetail = showDetail;

function subscribeDetail(gid) {
  if (gameDetailUnsub) gameDetailUnsub();
  // Listen to ONLY the 3 possible docs for this game instead of the whole
  // collection. Avoids re-reading every game_state every time any other game
  // updates.
  const ids = [gid, `${gid}_away`, `${gid}_home`];
  const latest = {};   // id -> {exists, data}
  const unsubs = ids.map(id =>
    onSnapshot(doc(db, 'game_states', id), (snap) => {
      latest[id] = { exists: snap.exists(), data: snap.data() || null };
      // Pick the freshest doc that exists
      const matching = Object.entries(latest)
        .filter(([, v]) => v.exists)
        .map(([id, v]) => ({ id, data: v.data }));
      if (!matching.length) {
        // Only show "ended" after all 3 listeners have reported
        if (Object.keys(latest).length === ids.length) renderDetailEnded();
        return;
      }
      matching.sort((a,b) => {
        const ta = a.data.savedAt?.seconds || a.data.savedAt?.toMillis?.() || 0;
        const tb = b.data.savedAt?.seconds || b.data.savedAt?.toMillis?.() || 0;
        return tb - ta;
      });
      renderDetail(gid, matching[0].data);
    })
  );
  gameDetailUnsub = () => unsubs.forEach(u => u && u());
}

function renderDetailEnded() {
  document.getElementById('detail').innerHTML = `
    <div class="empty">
      <h2>This game has ended</h2>
      <p>Final scores and box scores will appear on the schedule page.</p>
      <a href="#" onclick="showList();return false;">← Back to live games</a>
    </div>`;
}

function currentBatterName(g) {
  const side = battingSide(g);
  const lineup = (g.lineups && g.lineups[side]) || [];
  const idxObj = g.lineupIdx || {};
  const i = (idxObj[side] ?? 0) % Math.max(lineup.length, 1);
  const b = lineup[i];
  if (!b) return '—';
  return `#${b.num || '?'} ${b.name || 'Batter'}`;
}

function renderDetail(gid, g) {
  const away = g.awayTeam || {};
  const home = g.homeTeam || {};
  const battingIsAway = battingSide(g) === 'away';
  const outs = g.outs ?? 0;
  const balls = g.balls ?? 0;
  const strikes = g.strikes ?? 0;
  const r = g.runners || {};

  // Detect if it's been more than 5 min since last update
  const savedMs = g.savedAt?.toMillis?.() || (g.savedAt?.seconds ? g.savedAt.seconds*1000 : 0);
  const staleMin = savedMs ? Math.round((Date.now() - savedMs) / 60000) : null;
  const staleNote = (staleMin != null && staleMin >= 5)
    ? `Last update ${staleMin} min ago — scoring may be paused`
    : 'Updates live as the scorer taps';

  const lineScoreHTML = renderLineScore(g);
  const playLogHTML = renderPlayLog(g);

  document.getElementById('detail').innerHTML = `
    <div class="detail-hero">
      <div class="inning">${inningLabel(g)} &nbsp;·&nbsp; ${outs} out${outs===1?'':'s'}</div>
      <div class="score-row">
        <div class="side ${battingIsAway?'batting':''}">
          <img src="${logoUrl(away.id)}" alt="${away.short||''}" onerror="onLogoError(this)">
          <div class="short">${away.short || away.name || 'AWY'}</div>
          <div class="score">${g.awayScore ?? 0}</div>
        </div>
        <div class="vs">–</div>
        <div class="side ${!battingIsAway?'batting':''}">
          <img src="${logoUrl(home.id)}" alt="${home.short||''}" onerror="onLogoError(this)">
          <div class="short">${home.short || home.name || 'HME'}</div>
          <div class="score">${g.homeScore ?? 0}</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>At Bat</h3>
      <div class="bc-grid">
        <div class="bc-batter">
          <div class="label">Now batting</div>
          <div class="name">${currentBatterName(g)}</div>
        </div>
        <div class="bc-count">
          <div class="bs">${balls}-${strikes}</div>
          <div class="outs">
            <span class="out-dot ${outs>=1?'on':''}"></span>
            <span class="out-dot ${outs>=2?'on':''}"></span>
            <span class="out-dot ${outs>=3?'on':''}"></span>
          </div>
        </div>
      </div>
      <div class="diamond-wrap">
        <div class="diamond">
          <div class="base second ${r[2]?'on':''}"></div>
          <div class="base third ${r[3]?'on':''}"></div>
          <div class="base first ${r[1]?'on':''}"></div>
          <div class="base home"></div>
        </div>
      </div>
    </div>

    ${lineScoreHTML}
    ${playLogHTML}

    <div class="updated">${staleNote}</div>
  `;
}

function renderLineScore(g) {
  const ls = g.linescores || {};
  const awayLine = ls.away || [];
  const homeLine = ls.home || [];
  const maxInning = Math.max(awayLine.length, homeLine.length, g.inning || 1, 7);
  let head = '<th></th>';
  for (let i=1; i<=maxInning; i++) head += `<th>${i}</th>`;
  head += '<th class="rhe">R</th>';
  // Optionally H/E if tracked
  const awaySum = (awayLine || []).reduce((s,x)=>s+(Number(x)||0),0);
  const homeSum = (homeLine || []).reduce((s,x)=>s+(Number(x)||0),0);
  const cells = (arr, total, shortName) => {
    let html = `<td>${shortName}</td>`;
    for (let i=0; i<maxInning; i++){
      const v = arr[i];
      html += `<td>${v==null?'–':v}</td>`;
    }
    html += `<td class="rhe">${total}</td>`;
    return html;
  };
  return `
    <div class="panel linescore">
      <h3>Line Score</h3>
      <table>
        <thead><tr>${head}</tr></thead>
        <tbody>
          <tr>${cells(awayLine, g.awayScore ?? awaySum, g.awayTeam?.short || 'AWY')}</tr>
          <tr>${cells(homeLine, g.homeScore ?? homeSum, g.homeTeam?.short || 'HME')}</tr>
        </tbody>
      </table>
    </div>`;
}

function renderPlayLog(g) {
  const log = g.playLog || [];
  if (!log.length) {
    return `<div class="panel"><h3>Play-by-Play</h3><div style="color:var(--muted);font-size:14px;">No plays yet.</div></div>`;
  }
  const rows = log.slice(0, 40).map(p => `
    <div class="play">
      <div class="inning-tag">${p.inning || ''}<br>${p.team || ''}</div>
      <div class="body">
        <span class="result">${p.result || ''}</span>
        ${p.desc ? `<span class="desc">— ${p.desc}</span>` : ''}
        ${p.player ? `<div style="color:var(--muted);font-size:12px;margin-top:2px;">${p.player}</div>`:''}
        ${p.score ? `<span class="sc">${p.score}</span>` : ''}
      </div>
    </div>`).join('');
  return `<div class="panel"><h3>Play-by-Play</h3><div class="play-log">${rows}</div></div>`;
}

// ── deep-link support: /watch.html?g=<gameId> ────────
const params = new URLSearchParams(location.search);
const qGame = params.get('g');

// start the feed
subscribeList();
if (qGame) showDetail(qGame);
</script>
</body>
</html>
