const PDF_CODES = [...new Set(PDF_GAMES.flatMap(g=>[g.away,g.home]))].sort();

let firestoreTeams = [];
let teamMap = {}; // PDF code → Firestore team ID
let existingGameDocs = [];

window.checkMapping = async function() {
  document.getElementById('btn-check').disabled = true;
  logEl.innerHTML = '';
  out('Reading teams from Firestore...', 'info');
  try {
    const snap = await getDocs(collection(db, 'teams'));
    firestoreTeams = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    out(`Found ${firestoreTeams.length} teams in Firestore.`, 'ok');

    // Manual overrides: PDF code → team name keyword (case-insensitive substring match)
    const NAME_OVERRIDES = {
      'SA1':   'shir ami',
      'BA1':   'beth am',
      'TOAST': 'toast',
    };

    // Build mapping: try matching PDF code to team short or id (case-insensitive)
    teamMap = {};
    for (const code of PDF_CODES) {
      let match = firestoreTeams.find(t =>
        (t.short || '').toUpperCase() === code.toUpperCase() ||
        (t.id || '').toUpperCase() === code.toUpperCase()
      );
      // Fallback: name-based override
      if (!match && NAME_OVERRIDES[code]) {
        const kw = NAME_OVERRIDES[code].toLowerCase();
        match = firestoreTeams.find(t => (t.name || '').toLowerCase().includes(kw));
      }
      // If still no match for TOAST, just use 'toast' as ID
      teamMap[code] = match ? match.id : null;
    }

    // Show all Firestore teams first
    let allHtml = `<p style="color:#94a3b8;margin:12px 0 4px;font-size:12px">ALL FIRESTORE TEAMS (doc id · short · name):</p><table><thead><tr><th>Doc ID</th><th>short</th><th>Name</th></tr></thead><tbody>`;
    for (const t of firestoreTeams) {
      allHtml += `<tr><td>${t.id}</td><td>${t.short||'—'}</td><td>${t.name||'—'}</td></tr>`;
    }
    allHtml += '</tbody></table>';
    document.getElementById('mapping-table').innerHTML = allHtml;

    // Show mapping table
    const unmatched = PDF_CODES.filter(c => !teamMap[c]);
    let html = `<table><thead><tr><th>PDF Code</th><th>→ Firestore Team ID</th><th>Team Name</th><th>Status</th></tr></thead><tbody>`;
    for (const code of PDF_CODES) {
      const tid = teamMap[code];
      const tname = tid ? (firestoreTeams.find(t=>t.id===tid)?.name || '') : '???';
      const cls = tid ? 'match' : 'nomatch';
      const status = tid ? '✓ matched' : '✗ NO MATCH — will use PDF code as-is';
      html += `<tr><td>${code}</td><td class="${cls}">${tid || '—'}</td><td>${tname}</td><td class="${cls}">${status}</td></tr>`;
    }
    html += '</tbody></table>';
    document.getElementById('mapping-table').innerHTML = allHtml + html;

    if (unmatched.length > 0) {
      out(`⚠ ${unmatched.length} team(s) not matched in Firestore: ${unmatched.join(', ')}`, 'warn');
      out('These will be stored with the PDF code as the team ID. Make sure those teams exist in Firestore first, or the schedule will show the raw code.', 'warn');
    } else {
      out('✓ All 16 teams matched!', 'ok');
    }

    // Count existing 2026 games only
    const gSnap = await getDocs(collection(db, 'games'));
    existingGameDocs = gSnap.docs.filter(d => (d.data().date || '').startsWith('2026-'));
    out(`Found ${gSnap.docs.length} total games in Firestore.`, 'info');
    out(`Found ${existingGameDocs.length} games from 2026 (only these will be wiped).`, 'warn');
    out('Ready. Click Step 2 to wipe existing games.', 'ok');
    document.getElementById('btn-wipe').disabled = false;
  } catch(e) {
    out('ERROR: ' + e.message, 'err');
    document.getElementById('btn-check').disabled = false;
  }
};

window.wipeGames = async function() {
  if (!confirm(`DELETE all ${existingGameDocs.length} existing games from Firestore? This cannot be undone.`)) return;
  document.getElementById('btn-wipe').disabled = true;
  out(`Wiping ${existingGameDocs.length} games...`, 'warn');
  try {
    // Delete in batches of 500
    let batch = writeBatch(db);
    let count = 0;
    for (const d of existingGameDocs) {
      batch.delete(doc(db, 'games', d.id));
      count++;
      if (count % 500 === 0) { await batch.commit(); batch = writeBatch(db); }
    }
    await batch.commit();
    out(`✓ Deleted ${existingGameDocs.length} games.`, 'ok');
    out('Ready. Click Step 3 to load the new schedule.', 'ok');
    document.getElementById('btn-load').disabled = false;
  } catch(e) {
    out('ERROR wiping: ' + e.message, 'err');
    document.getElementById('btn-wipe').disabled = false;
  }
};

window.loadGames = async function() {
  document.getElementById('btn-load').disabled = true;
  out('Loading 112 games...', 'info');
  try {
    let batch = writeBatch(db);
    let count = 0;
    for (const g of PDF_GAMES) {
      const awayId = teamMap[g.away] || g.away.toLowerCase();
      const homeId = teamMap[g.home] || g.home.toLowerCase();
      const ref = doc(collection(db, 'games'));
      batch.set(ref, {
        wk:    g.wk,
        date:  g.date,
        time:  g.time,
        away:  awayId,
        home:  homeId,
        field: g.field,
        done:  false,
      });
      count++;
      if (count % 500 === 0) { await batch.commit(); batch = writeBatch(db); }
    }
    await batch.commit();
    out(`✓ Loaded ${count} games successfully!`, 'ok');
    out('All done! Go check the site schedule.', 'ok');
  } catch(e) {
    out('ERROR loading games: ' + e.message, 'err');
    document.getElementById('btn-load').disabled = false;
  }
};
