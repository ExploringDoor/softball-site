<!DOCTYPE html>
<html>
<head><title>DVSL — Clean Up Old Players in Firebase</title></head>
<body style="font-family:monospace;background:#111;color:#eee;padding:40px">
<h2>DVSL Firebase: Remove Old Fake Players</h2>
<p style="color:#f87171">This will delete all players that are NOT in the real rosters you provided.</p>
<button id="checkBtn" onclick="checkPlayers()">Step 1: Check players</button>
<button id="deleteBtn" onclick="deleteFake()" disabled>Step 2: Delete fake players</button>
<pre id="log" style="background:#000;padding:20px;border-radius:8px;max-height:700px;overflow:auto"></pre>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import { getFirestore, collection, getDocs, deleteDoc, doc } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyDXuC-R0aPEX4F7lN5AKq48UC3r5whYzdg",
  authDomain: "dvsl-292dd.firebaseapp.com",
  projectId: "dvsl-292dd",
  storageBucket: "dvsl-292dd.firebasestorage.app",
  messagingSenderId: "145862305559",
  appId: "1:145862305559:web:153ec455bad57e17517952"
});
const db = getFirestore(app);

const log = document.getElementById('log');

  // BOR
  'Jason Kundtz','Marcos Aliaga','Jason Bonder','Mark Chasen','Dori Fleekop','Allan Goldshteyn','Brad Hersh','Scott Hogan','Tyler Ice','Skylar Katz','Benjamin Kollender','Philip Mintz','Michael Rosenfeld','Zach Simon','Jeff Wallis','Jeff Wilderman',
  // BSMC
  'Max Miller','Zach Bergman','Robert Cohan','Neil Cohen','Tyler Faimon','Cody Gross','Matt Grubman','David Holin','Danny Kessler','Jason Kessler','Marc Korman','Howard Koval','Jacob Kriegler','Max Lefton','Blake Milstein','David Minkoff','Steven Pilchik','Alan Resnick','Tyler Rosenblatt','Steven Smith',
  // BTBJ
  'Michael Drossner','Jeff Braverman','Michael Frey','Josh Gayl','Joshua Goldstein','Aaron Greenfield','Dan Heckman','Ari Kleinman','David Kline','Kenneth Mann','Andrew Miller','Ben Picker','Jon Rubin','Michael Seeherman','Eric Stern','Sandy Wine',
  // CHA
  'Michael Cook','Demetrius Barry','Carson Cohen','Max Fenster','Aaron Goldstein','Jason Goldstein','Brett Jacobson','Tyler Jacobson','Collin Johnson','Tom Levy','Matt Martin','Jake Miller','C.J. Mittica','Rick Rosenstein','Jeff Schonberg','Jayson Tessler','Ian Vogt',
  // DN
  'Aaron Mondelblatt','Mike Altmeier','Scott Haimovitz','Neal Jacobs','Eric Johnstin','Mike Kushner','Andrew Lerner','Adam Miller','Tad Moses','Scott Parmenter','David Silverman','Jason Smukler','Noah Sokoloff','Ken Weinstein',
  // GJC
  'Joel Fish','Jake Greenberg','Sean Davis','Sean Fennell','Noah Friedman-Nathan','Chris Gerhardt','Jake Gold','Robert Heller','Adam Hoch','Dale Hoover','Nate Johnson','Aaron Kavesh','Brian Kripke','Samuel Pitkow','Sean Reisman','Ivan Wolnek',
  // GOLD
  'Scott Crayder','Austin Betman','David Betman','Kyle Bruck','Matt Crayder','Brian Gelfand','Justin Gelfand','Kyle Katz','Allan Kaufman','Mitch Pratta','Bryce Rotkin','Jake Segal','Darin Steinberg','Ryan Toltzis','Jason Walter','Cole Weinstein','Jonathan Wilk',
  // KI
  'Jeffrey Orlin','Jeff Cohen','Evan Finkelstein','Kayla Finkelstein','Ken Finkelstein','Steve Gable','Steven Hirshberg','Marc Klein','Joshua Kohler','Gary Kushner','Michael Leese','Stefan Leon','Jacob Snellenburg','Jeffrey Snellenburg','Lewis Wigod',

  'Todd Leon','Rick Phillips','Andrew Abovitz','Matt Catagnus','David Greenfield','Dan Karlyn','George Katsanos','Lawrance Kimmel','Larry Levin','Jake Nyman','Scott Palman','Ryan Phillips','Andrew Shpigel',
  // TBIR
  'Mark Schwartz','Shawn Berwager','Eric Drossner','Ryan Drossner','Ben Kessel','Drew Perel','Jason Saylor','Ben Schwartz','Zach Schwartz','Andrew Snyderman','Jason Snyderman',
  // TBIMC
  'Matthew Seltzer','Gad Ages','Mike Blum','Colin Fox','Stephen Granger','Jared Griffin','Joseph Grinenko','Brian Hessler','Ross Kasper','Andrew Kosoy','Kevin Lefkowitz','Robert Pfeifer','Shane Pfeifer','Brian Schachter','Adam Schulang','Andy Siegel','David Tener','Jacob Weiner','Harris Zettler',
  // TSBKA
  'Zach Sheard','Jesse Wexelblatt','Jacob Brownstein','David Davis','Ryan Davis','Andrew Devine','Jason Harrison','David Howard','Eugene Kuntorovsky','Tyler Lane','Bryan Maguire','Justin Mellinger','Cory Nadler','Zach Orenstein','Brandon Rose','Jared Rosenbloom','Joel Rosenwasser','Evan Saltzman','Steven Schneer','Zack Schulman','Josh Stumpf',
]);

// Adam Miller appears on both DN and TBIR — include both
REAL_PLAYERS.add('Adam Miller');

let toDelete = [];

window.checkPlayers = async function(){
  log.textContent = '';
  out('Fetching all players from Firebase...\n');
  try {
    const snap = await getDocs(collection(db, 'players'));
    const all = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
    out(`Found ${all.length} players in Firebase.\n`);

    const real = all.filter(p => REAL_PLAYERS.has(p.name));
    const fake = all.filter(p => !REAL_PLAYERS.has(p.name));

    out(`✅ ${real.length} real roster players`);
    out(`❌ ${fake.length} old/fake players to remove\n`);

    if(fake.length){
      out('Players to DELETE:');
      fake.forEach(p => out(`  ❌ ${p.name} (${p.team}) — avg:${p.avg}`));
      toDelete = fake;
      document.getElementById('deleteBtn').disabled = false;
    } else {
      out('No fake players found!');
    }
  } catch(e){
    out('ERROR: ' + e.message);
    console.error(e);
  }
};

window.deleteFake = async function(){
  if(!toDelete.length) return;
  document.getElementById('deleteBtn').disabled = true;
  out('\nDeleting ' + toDelete.length + ' fake players...\n');
  let deleted = 0;
  for(const p of toDelete){
    try {
      await deleteDoc(doc(db, 'players', p.docId));
      out(`  ✅ Deleted: ${p.name} (${p.team})`);
      deleted++;
    } catch(e){
      out(`  ❌ Failed: ${p.name} — ${e.message}`);
    }
  }
  out(`\nDone! Deleted ${deleted}/${toDelete.length} fake players.`);
  out('Refresh your site to see only real roster players.');
};
</script>
</body>
</html>
