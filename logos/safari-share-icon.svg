<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="140" height="175" aria-label="Safari Share icon">
  <!-- Approximation of the iOS Safari "square.and.arrow.up" share glyph.
       iOS blue (#007aff) stroked outline; no fill. Not an official Apple
       asset — swap in a real screenshot if pixel-perfect matters. -->
  <g fill="none" stroke="#007aff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arrow shaft (up) -->
    <line x1="60" y1="13" x2="60" y2="86"/>
    <!-- Arrow head (chevron) -->
    <polyline points="34,39 60,13 86,39"/>
    <!-- Box — open at top so the arrow reads as "emerging from" the box -->
    <path d="M 32 52 L 17 52 Q 9 52 9 60 L 9 130 Q 9 138 17 138 L 103 138 Q 111 138 111 130 L 111 60 Q 111 52 103 52 L 88 52"/>
  </g>
</svg>
