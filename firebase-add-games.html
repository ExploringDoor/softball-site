<!DOCTYPE html>
<html>
<head><title>DVSL — Add Missing Games to Firebase</title></head>
<body style="font-family:monospace;background:#111;color:#eee;padding:40px">
<h2>DVSL Firebase: Check & Add Missing Games (Weeks 11-14)</h2>
<button id="checkBtn" onclick="checkGames()">Step 1: Check what's in Firebase</button>
<button id="addBtn" onclick="addMissing()" disabled>Step 2: Add missing games</button>
<pre id="log" style="background:#000;padding:20px;border-radius:8px;max-height:600px;overflow:auto"></pre>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import { getFirestore, collection, getDocs, addDoc, query, orderBy } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyDXuC-R0aPEX4F7lN5AKq48UC3r5whYzdg",
  authDomain: "dvsl-292dd.firebaseapp.com",
  projectId: "dvsl-292dd",
  storageBucket: "dvsl-292dd.firebasestorage.app",
  messagingSenderId: "145862305559",
  appId: "1:145862305559:web:153ec455bad57e17517952"
});
const db = getFirestore(app);

const log = document.getElementById('log');
function out(msg){ log.textContent += msg + '\n'; }

const FIELDS = [
  {name:'Mondauk 4', addr:'1451 Dillon Rd, Ambler PA'},
  {name:'Mondauk 5', addr:'1451 Dillon Rd, Ambler PA'},
  {name:'Southampton', addr:'484 Gravel Hill Rd, Southampton PA'},
  {name:'Sunnybrook', addr:'Church Rd, Elkins Park PA'},
  {name:'Warwick', addr:'2301 Dark Hollow Rd, Jamison PA'},
  {name:'Plymouth', addr:'2919 Walton Rd, Plymouth Mtg PA'},
  {name:'Horsham', addr:'308 Cedar Hill Rd, Ambler PA'},
  {name:'Ridgeway', addr:'Ridgeway Ave, Jenkintown PA'},
  {name:'Abington', addr:'1030 Old York Rd, Abington PA'},
];

const TEAMS = ['aj','ba','bob','bor','bsb','bsmc','btbj','cha','dn','gjc','gold','ki','oa','sa','tsbka','tsmc','tsg','tbimc','tbir'];

// 9 games per week = 18 teams play, 1 bye
// Each week: 5 games at 7:00 PM, 4 games at 8:15 PM
const WEEKS_TO_ADD = [
  { wk:11, dates:[{date:'Jun 23',day:'Mon'},{date:'Jun 25',day:'Wed'}], bye:'bsb',
    matchups:[
      ['gold','aj'], ['sa','bor'], ['ki','btbj'], ['tsmc','dn'], ['bob','gjc'],
      ['oa','tbimc'], ['ba','cha'], ['tsbka','tbir'], ['tsg','bsmc']
    ]},
  { wk:12, dates:[{date:'Jun 30',day:'Mon'},{date:'Jul 2',day:'Wed'}], bye:'cha',
    matchups:[
      ['tbir','gold'], ['bor','ki'], ['gjc','sa'], ['dn','bob'], ['aj','tsmc'],
      ['bsmc','oa'], ['tbimc','ba'], ['btbj','tsg'], ['bsb','tsbka']
    ]},
  { wk:13, dates:[{date:'Jul 7',day:'Mon'},{date:'Jul 9',day:'Wed'}], bye:'tsg',
    matchups:[
      ['ki','gold'], ['sa','aj'], ['bob','bor'], ['tsmc','tbir'], ['oa','btbj'],
      ['ba','dn'], ['gjc','bsmc'], ['cha','tbimc'], ['tsbka','bsb']
    ]},
  { wk:14, dates:[{date:'Jul 14',day:'Mon'},{date:'Jul 16',day:'Wed'}], bye:'dn',
    matchups:[
      ['gold','sa'], ['aj','ki'], ['bor','gjc'], ['bob','tsmc'], ['btbj','ba'],
      ['tbir','oa'], ['tbimc','tsg'], ['bsb','cha'], ['bsmc','tsbka']
    ]},
];

// Build the full game list for weeks 11-14
const GAMES_TO_ADD = [];
WEEKS_TO_ADD.forEach(wk => {
  wk.matchups.forEach((m, i) => {
    // First 5 games on first date at 7:00 PM, next 4 on second date at 8:15 PM
    const isFirstNight = i < 5;
    const dateInfo = isFirstNight ? wk.dates[0] : wk.dates[1];
    const time = isFirstNight ? '7:00 PM' : '8:15 PM';
    const field = FIELDS[i % FIELDS.length];
    GAMES_TO_ADD.push({
      wk: wk.wk,
      date: dateInfo.date,
      day: dateInfo.day,
      time: time,
      field: field.name,
      addr: field.addr,
      away: m[0],
      home: m[1],
      away_score: null,
      home_score: null,
      done: false
    });
  });
});

let existingGames = [];
let missingGames = [];

window.checkGames = async function(){
  log.textContent = '';
  out('Fetching games from Firebase...\n');
  try {
    const q = query(collection(db, 'games'), orderBy('wk'));
    const snap = await getDocs(q);
    existingGames = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    out(`Found ${existingGames.length} games in Firebase.\n`);

    // Group by week
    const wkMap = {};
    existingGames.forEach(g => {
      if(!wkMap[g.wk]) wkMap[g.wk] = [];
      wkMap[g.wk].push(g);
    });

    const existingWks = Object.keys(wkMap).sort((a,b) => a-b);
    out('Existing weeks: ' + existingWks.join(', '));
    existingWks.forEach(wk => {
      out(`  Week ${wk}: ${wkMap[wk].length} games`);
    });

    // Check which of our games are missing
    missingGames = GAMES_TO_ADD.filter(ag => {
      return !existingGames.some(eg =>
        eg.wk === ag.wk && eg.away === ag.away && eg.home === ag.home
      );
    });

    out('\n————————————————————————');
    if(missingGames.length === 0){
      out('\n✅ Weeks 11-14 are complete! Nothing to add.');
    } else {
      out(`\n⚠️  ${missingGames.length} games to add:\n`);
      [11,12,13,14].forEach(wk => {
        const wkGames = missingGames.filter(g => g.wk === wk);
        if(wkGames.length){
          out(`Week ${wk} (${wkGames.length} games):`);
          wkGames.forEach(g => {
            out(`  ${g.away} @ ${g.home} — ${g.date} ${g.time} — ${g.field}`);
          });
          out('');
        }
      });
      out('Click "Step 2" to add them to Firebase.');
      document.getElementById('addBtn').disabled = false;
    }
  } catch(e){
    out('ERROR: ' + e.message);
    console.error(e);
  }
};

window.addMissing = async function(){
  if(!missingGames.length){ out('\nNothing to add.'); return; }
  document.getElementById('addBtn').disabled = true;
  out('\nAdding ' + missingGames.length + ' games...\n');

  let added = 0;
  for(const g of missingGames){
    try {
      await addDoc(collection(db, 'games'), g);
      out(`  ✅ Wk ${g.wk}: ${g.away} @ ${g.home} — ${g.date} ${g.time}`);
      added++;
    } catch(e){
      out(`  ❌ Wk ${g.wk}: ${g.away} @ ${g.home} — ${e.message}`);
    }
  }
  out(`\nDone! Added ${added}/${missingGames.length} games.`);
  out('Refresh your site to see weeks 11-14.');
};
</script>
</body>
</html>
