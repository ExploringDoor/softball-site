<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#002D72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DVSL">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>
  // SW registration + notification UI.
  //
  // The UI is a floating bell (bottom-right, always visible once the user
  // has an FCM token) that opens a dropdown panel with the unread list.
  // Panel: three-section flex column (header, scrollable list, footer),
  // backdrop-dimmed and body-scroll-locked so the page behind can't be
  // scrolled while it's open. Footer link → /inbox.html for the full
  // page view.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then(r => { try { r.update(); } catch(_){} }).catch(() => {});
      let _dvslReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (_dvslReloaded) return;
        _dvslReloaded = true;
        window.location.reload();
      });
      navigator.serviceWorker.ready.then(r => {
        if (r.active) r.active.postMessage({ type: 'GET_VERSION' });
      }).catch(() => {});
      navigator.serviceWorker.addEventListener('message', (e) => {
        if (!e.data) return;
        if (e.data.type === 'VERSION' && typeof e.data.version === 'string') {
          let b = document.getElementById('dvsl-sw-version');
          if (!b) {
            b = document.createElement('div');
            b.id = 'dvsl-sw-version';
            b.style.cssText = 'position:fixed;bottom:2px;left:4px;font:9px/1 ui-monospace,monospace;color:rgba(0,0,0,.25);z-index:99999;pointer-events:none;user-select:none';
            document.body.appendChild(b);
          }
          b.textContent = e.data.version;
        }
      });

      // ── Notification bell ──
      let _dvslLastCheck = 0;
      let _dvslLastItems = [];
      let _dvslLastSig = null;
      let _dvslSavedScrollY = null;

      async function _dvslCheckPendingNav() {
        const now = Date.now();
        if (now - _dvslLastCheck < 3000) return;
        _dvslLastCheck = now;
        const token = localStorage.getItem('dvsl-notif-token');
        if (!token) {
          if (_dvslLastSig !== '') { _dvslLastSig = ''; _dvslLastItems = []; _dvslRenderBell(); }
          return;
        }
        try {
          const resp = await fetch('/api/check-pending-nav', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token }),
          });
          if (!resp.ok) return;
          const data = await resp.json();
          const items = Array.isArray(data && data.items) ? data.items : [];
          _dvslLastItems = items;
          // Always refresh the badge count; only rebuild panel rows if the
          // signature changed (prevents flicker on 5s poll).
          _dvslUpdateBadge();
          const sig = items.map(it => it.id).sort().join(',');
          if (sig === _dvslLastSig) return;
          _dvslLastSig = sig;
          if (document.getElementById('dvsl-bell-panel')) _dvslRenderPanel();
        } catch(_) {}
      }

      function _dvslEnsureBell() {
        if (document.getElementById('dvsl-bell')) return;
        const bell = document.createElement('button');
        bell.id = 'dvsl-bell';
        bell.setAttribute('aria-label', 'Notifications');
        bell.style.cssText = 'position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));right:12px;z-index:99998;width:48px;height:48px;border-radius:50%;background:#002D72;color:#fff;border:0;box-shadow:0 3px 12px rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0';
        const icon = document.createElement('span');
        icon.textContent = '🔔';
        icon.style.cssText = 'font-size:22px;line-height:1';
        const badge = document.createElement('span');
        badge.id = 'dvsl-bell-badge';
        badge.style.cssText = 'position:absolute;top:-4px;right:-4px;background:#e53935;color:#fff;font:700 11px/1 system-ui,-apple-system,sans-serif;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:none;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3)';
        bell.appendChild(icon);
        bell.appendChild(badge);
        bell.addEventListener('click', (e) => {
          e.stopPropagation();
          if (document.getElementById('dvsl-bell-panel')) _dvslClosePanel();
          else _dvslOpenPanel();
        });
        document.body.appendChild(bell);
      }
      function _dvslUpdateBadge() {
        _dvslEnsureBell();
        const count = _dvslLastItems.length;
        const badge = document.getElementById('dvsl-bell-badge');
        if (!badge) return;
        if (count > 0) {
          badge.style.display = 'flex';
          badge.textContent = count > 99 ? '99+' : String(count);
        } else {
          badge.style.display = 'none';
        }
      }
      function _dvslRenderBell() {
        const token = localStorage.getItem('dvsl-notif-token');
        if (!token) {
          const b = document.getElementById('dvsl-bell');
          if (b) b.remove();
          _dvslClosePanel();
          return;
        }
        _dvslUpdateBadge();
        if (document.getElementById('dvsl-bell-panel')) _dvslRenderPanel();
      }

      // ── Body scroll lock (iOS PWA-safe) ──
      function _dvslLockBody() {
        if (_dvslSavedScrollY != null) return;
        _dvslSavedScrollY = window.scrollY || 0;
        document.body.style.position = 'fixed';
        document.body.style.top = '-' + _dvslSavedScrollY + 'px';
        document.body.style.left = '0';
        document.body.style.right = '0';
        document.body.style.width = '100%';
      }
      function _dvslUnlockBody() {
        if (_dvslSavedScrollY == null) return;
        const y = _dvslSavedScrollY;
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        document.body.style.width = '';
        _dvslSavedScrollY = null;
        window.scrollTo(0, y);
      }

      function _dvslOpenPanel() {
        _dvslLockBody();
        const backdrop = document.createElement('div');
        backdrop.id = 'dvsl-bell-backdrop';
        backdrop.style.cssText = 'position:fixed;inset:0;z-index:99996;background:rgba(0,0,0,.28);opacity:0;transition:opacity 150ms;touch-action:none';
        backdrop.addEventListener('click', _dvslClosePanel);
        document.body.appendChild(backdrop);
        requestAnimationFrame(() => { backdrop.style.opacity = '1'; });

        const panel = document.createElement('div');
        panel.id = 'dvsl-bell-panel';
        // Panel docks above the bell (bottom-right corner). Slides UP on open.
        panel.style.cssText = 'position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:12px;z-index:99997;width:min(340px, calc(100vw - 24px));max-height:min(70vh, 520px);display:flex;flex-direction:column;background:#fff;color:#111;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.28);font:500 14px/1.35 system-ui,-apple-system,Segoe UI,Inter,sans-serif;border:1px solid rgba(0,0,0,0.06);overflow:hidden;transform:translateY(6px);opacity:0;transition:opacity 160ms, transform 160ms';
        document.body.appendChild(panel);
        requestAnimationFrame(() => { panel.style.opacity = '1'; panel.style.transform = 'translateY(0)'; });
        _dvslRenderPanel();
      }
      function _dvslClosePanel() {
        const b = document.getElementById('dvsl-bell-backdrop');
        const p = document.getElementById('dvsl-bell-panel');
        if (b) b.remove();
        if (p) p.remove();
        _dvslUnlockBody();
      }

      function _dvslAgo(ts) {
        const s = Math.max(0, Math.floor((Date.now() - (ts || 0)) / 1000));
        if (s < 60) return 'just now';
        if (s < 3600) return Math.floor(s/60) + 'm ago';
        if (s < 86400) return Math.floor(s/3600) + 'h ago';
        return Math.floor(s/86400) + 'd ago';
      }

      function _dvslRenderPanel() {
        const panel = document.getElementById('dvsl-bell-panel');
        if (!panel) return;
        const items = _dvslLastItems || [];
        panel.innerHTML = '';

        // Header
        const head = document.createElement('div');
        head.style.cssText = 'flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#f7f7f7;border-bottom:1px solid #eee';
        const ttl = document.createElement('div');
        ttl.textContent = 'Notifications';
        ttl.style.cssText = 'flex:1 1 auto;font-weight:700;color:#111';
        const clr = document.createElement('button');
        clr.textContent = 'Clear all';
        clr.style.cssText = 'background:transparent;border:0;color:#002D72;font:600 12px/1 system-ui,-apple-system,sans-serif;cursor:pointer;padding:6px 4px';
        clr.disabled = items.length === 0;
        if (clr.disabled) clr.style.opacity = '0.4';
        clr.addEventListener('click', (e) => {
          e.stopPropagation();
          if (items.length === 0) return;
          _dvslDismissAll();
          _dvslLastSig = '';
          _dvslLastItems = [];
          _dvslClosePanel();
          _dvslUpdateBadge();
        });
        head.appendChild(ttl);
        head.appendChild(clr);
        panel.appendChild(head);

        // Scrollable list (middle)
        const list = document.createElement('div');
        list.style.cssText = 'flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch';
        if (!items.length) {
          const empty = document.createElement('div');
          empty.style.cssText = 'padding:28px 14px;text-align:center;color:#888;font-weight:500';
          empty.innerHTML = '<div style="font-size:32px;opacity:.5;margin-bottom:6px">📭</div>No new notifications';
          list.appendChild(empty);
        } else {
          items.forEach(item => {
            const row = document.createElement('div');
            row.style.cssText = 'display:flex;align-items:flex-start;gap:8px;padding:12px 14px;border-bottom:1px solid #f2f2f2;cursor:pointer';
            row.addEventListener('mouseenter', () => { row.style.background = '#f8f8f8'; });
            row.addEventListener('mouseleave', () => { row.style.background = ''; });
            const txt = document.createElement('div');
            txt.style.cssText = 'flex:1 1 auto;min-width:0';
            const t = document.createElement('div');
            t.textContent = (item.title || 'DVSL').slice(0, 80);
            t.style.cssText = 'font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
            txt.appendChild(t);
            if (item.body) {
              const bd = document.createElement('div');
              bd.textContent = item.body.slice(0, 120);
              bd.style.cssText = 'font:400 13px/1.35 system-ui,-apple-system,sans-serif;color:#555;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
              txt.appendChild(bd);
            }
            const wh = document.createElement('div');
            wh.textContent = _dvslAgo(item.ts);
            wh.style.cssText = 'font:400 11px/1 system-ui,-apple-system,sans-serif;color:#999;margin-top:4px';
            txt.appendChild(wh);
            const x = document.createElement('button');
            x.textContent = '×';
            x.setAttribute('aria-label', 'Dismiss');
            x.style.cssText = 'flex:0 0 auto;background:transparent;color:#999;border:0;width:28px;height:28px;font:400 20px/1 system-ui,sans-serif;cursor:pointer;padding:0;border-radius:4px';
            x.addEventListener('click', (e) => {
              e.stopPropagation();
              _dvslDismiss(item);
              row.remove();
              _dvslLastItems = (_dvslLastItems || []).filter(i => i.id !== item.id);
              _dvslUpdateBadge();
              // If the list is empty, swap in the empty state.
              if (!_dvslLastItems.length) _dvslRenderPanel();
            });
            row.addEventListener('click', () => _dvslConsumeAndNav(item));
            row.appendChild(txt);
            row.appendChild(x);
            list.appendChild(row);
          });
        }
        panel.appendChild(list);

        // Footer: always links to full inbox.
        const foot = document.createElement('a');
        foot.href = '/inbox.html';
        foot.textContent = 'See all in inbox →';
        foot.style.cssText = 'flex:0 0 auto;display:block;padding:12px 14px;text-align:center;font-weight:700;color:#002D72;text-decoration:none;background:#fafafa;border-top:1px solid #eee';
        panel.appendChild(foot);
      }

      function _dvslConsumeAndNav(item) {
        const token = localStorage.getItem('dvsl-notif-token');
        if (token && item && item.id) {
          fetch('/api/dismiss-pending-nav', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, id: item.id }),
          }).catch(() => {});
        }
        _dvslClosePanel();
        try {
          const t = new URL((item && item.url) || '/', location.origin);
          window.location.href = t.href;
        } catch(_) { window.location.href = '/'; }
      }
      function _dvslDismiss(item) {
        const token = localStorage.getItem('dvsl-notif-token');
        if (!token || !item || !item.id) return;
        fetch('/api/dismiss-pending-nav', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, id: item.id }),
        }).catch(() => {});
      }
      function _dvslDismissAll() {
        const token = localStorage.getItem('dvsl-notif-token');
        if (!token) return;
        fetch('/api/dismiss-pending-nav', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, dismissAll: true }),
        }).catch(() => {});
      }

      // Render the bell immediately if the user is already subscribed
      // (avoids a delay waiting for the first poll). The badge count fills
      // in once the first /api/check-pending-nav call returns.
      if (localStorage.getItem('dvsl-notif-token')) _dvslEnsureBell();
      _dvslCheckPendingNav();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') _dvslCheckPendingNav();
      });
      window.addEventListener('pageshow', _dvslCheckPendingNav);
      window.addEventListener('focus', _dvslCheckPendingNav);
      setInterval(() => {
        if (document.visibilityState === 'visible') _dvslCheckPendingNav();
      }, 5000);
    });
  }
</script>
<title>Team Chat — DVSL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f5;--card:#ffffff;--card2:#f8f8f8;--card3:#f0f0f0;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.15);
  --navy:#002D72;--navy-light:rgba(0,45,114,0.08);
  --white:#1a1a1a;--muted:rgba(0,0,0,0.5);--muted2:rgba(0,0,0,0.35);
  --red:#c8102e;--green:#22c55e;
}
html,body{height:100%}
body{background:var(--bg);color:var(--white);font-family:'Inter',sans-serif;line-height:1.6;display:flex;flex-direction:column}

/* Nav */
.nav{position:sticky;top:0;z-index:40;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,0.97);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border)}
.nav-brand{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);text-decoration:none;display:flex;align-items:center;gap:8px}
.nav-back{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:6px}

/* Header card */
.team-hdr{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.team-hdr .logo{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;overflow:hidden}
.team-hdr .logo img{width:100%;height:100%;object-fit:contain}
.team-hdr .name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;letter-spacing:.02em;line-height:1}
.team-hdr .sub{font-size:12px;opacity:.85;margin-top:2px}
.team-hdr .me{margin-left:auto;font-size:11px;opacity:.85;text-align:right}
.team-hdr .me a{color:#fff;text-decoration:underline;cursor:pointer}

/* Messages list */
.chat-wrap{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg2)}
.msg{max-width:82%;display:flex;flex-direction:column;gap:2px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.theirs{align-self:flex-start;align-items:flex-start}
.msg .who{font-size:11px;font-weight:600;color:var(--muted);padding:0 4px}
.msg .who.captain{color:var(--navy)}
.msg .bubble{padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap;max-width:100%}
.msg.mine .bubble{background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.theirs .bubble{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.captain .bubble{background:#fff;border:1px solid rgba(0,45,114,.25);border-left:3px solid var(--navy)}
.msg .time{font-size:10px;color:var(--muted2);padding:0 4px}
.msg .bubble{position:relative}
.msg .del-btn{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--bg2);font-size:12px;line-height:1;font-weight:700;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
.msg.mine .del-btn,.msg.can-delete .del-btn{display:flex}
.msg .del-btn:hover{transform:scale(1.1)}

/* Admin reset link */
.team-hdr .admin-actions{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;opacity:.85;text-align:right}
.team-hdr .admin-actions a{color:#fff;text-decoration:underline;cursor:pointer}
.team-hdr .admin-actions .reset-link{color:#ffb4b4}

.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:14px}

/* Input row */
.input-row{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--border);position:sticky;bottom:0}
.input-row input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:22px;font-size:15px;outline:none;background:var(--card2)}
.input-row input:focus{border-color:var(--navy);background:#fff}
.input-row button{padding:0 20px;border:none;background:var(--navy);color:#fff;border-radius:22px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:14px;cursor:pointer}
.input-row button:disabled{opacity:.5;cursor:not-allowed}

/* Identity modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:400px;width:100%;padding:24px;max-height:85vh;overflow-y:auto}
.modal h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;margin-bottom:6px}
.modal p{font-size:13px;color:var(--muted);margin-bottom:16px}
.roster-list{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow-y:auto;margin-bottom:14px;border:1px solid var(--border);border-radius:8px;padding:6px}
.roster-item{padding:10px 12px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.roster-item:hover{background:var(--bg2)}
.roster-item .jersey{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--muted);font-size:13px;min-width:32px}
.custom-name{border-top:1px solid var(--border);padding-top:14px}
.custom-name label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.custom-name input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.custom-name button{margin-top:10px;width:100%;padding:10px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer}

/* Team picker */
.team-picker{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.team-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 12px;text-align:center;cursor:pointer;text-decoration:none;color:var(--white);transition:all .15s}
.team-card:hover{border-color:var(--navy);box-shadow:0 2px 10px rgba(0,45,114,.1)}
.team-card .tlogo{width:48px;height:48px;margin:0 auto 8px;display:grid;place-items:center}
.team-card .tlogo img{width:100%;height:100%;object-fit:contain}
.team-card .tname{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em}

/* Misc */
.hidden{display:none!important}
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-brand">DVSL</a>
  <a href="index.html" class="nav-back">← Home</a>
</nav>

<!-- Team picker (shown when no ?team= param) -->
<div id="picker-view" class="hidden">
  <div style="padding:24px 20px 8px">
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;line-height:1;color:var(--navy);letter-spacing:-.01em">TEAM CHAT</div>
    <div style="font-size:13px;color:var(--muted);margin-top:4px">Pick your team to join the chat.</div>
  </div>
  <div id="team-picker-grid" class="team-picker">
    <div class="loading">Loading teams…</div>
  </div>
</div>

<!-- Chat view (shown when ?team= param present) -->
<div id="chat-view" class="hidden" style="flex:1;display:flex;flex-direction:column;min-height:0">
  <div class="team-hdr" id="team-hdr">
    <div class="logo" id="team-logo"></div>
    <div>
      <div class="name" id="team-name">Loading…</div>
      <div class="sub" id="team-sub">Team Chat</div>
    </div>
    <div class="me admin-actions">
      <div id="me-name">—</div>
      <div>
        <a onclick="changeIdentity()">Change</a>
        <a id="reset-link" class="reset-link hidden" onclick="resetChat()" style="margin-left:8px">Reset chat</a>
      </div>
    </div>
  </div>

  <div class="chat-wrap" id="chat-wrap">
    <div class="loading">Loading messages…</div>
  </div>

  <div class="input-row">
    <input id="msg-input" type="text" placeholder="Message your team…" maxlength="500" autocomplete="off"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
    <button onclick="sendMessage()" id="send-btn">Send</button>
  </div>
</div>

<!-- Identity modal -->
<div id="identity-modal" class="modal-bg hidden">
  <div class="modal">
    <h2 id="identity-title">Who are you?</h2>
    <p>Pick your name so your teammates know who's talking.</p>
    <div id="roster-list" class="roster-list">
      <div class="loading" style="padding:20px">Loading roster…</div>
    </div>
    <div class="custom-name">
      <label for="custom-name-input">Not on the roster? Type a name:</label>
      <input id="custom-name-input" type="text" placeholder="e.g. Adam M." maxlength="40">
      <button onclick="saveCustomIdentity()">Continue</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import { getFirestore, collection, query, where, orderBy, limit, onSnapshot, addDoc, getDocs, doc, deleteDoc, writeBatch, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDXuC-R0aPEX4F7lN5AKq48UC3r5whYzdg",
  authDomain: "dvsl-292dd.firebaseapp.com",
  projectId: "dvsl-292dd",
  storageBucket: "dvsl-292dd.firebasestorage.app",
  messagingSenderId: "145862305559",
  appId: "1:145862305559:web:153ec455bad57e17517952"
};
const PUSH_SECRET = 'dvsl-push-2026-rkj3849f';

const app = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(app);

// ── URL & state ──────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const teamId = params.get('team') || '';
// Admin mode — enables "Reset chat" button + delete-any-message on taps.
// Gated via ?admin=1 URL param AND a localStorage key set once on first use;
// matches the same pattern used in notifications.html. Not a hard security
// boundary (Firestore rules are), just a UI reveal.
const IS_ADMIN = params.get('admin') === '1' || localStorage.getItem('dvsl-is-admin') === '1';
if (params.get('admin') === '1') localStorage.setItem('dvsl-is-admin', '1');
let TEAM = null;
let ROSTER = [];
let IDENTITY = null; // { name, email, is_captain }
let unsub = null;
let MSG_CACHE = {}; // id → message doc (for delete lookup)

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ── Boot ─────────────────────────────────────────────────────────────
if (!teamId) {
  showTeamPicker();
} else {
  loadTeamAndChat(teamId);
}

async function showTeamPicker() {
  document.getElementById('picker-view').classList.remove('hidden');
  let teams = [];
  try {
    const snap = await getDocs(collection(db, 'teams'));
    teams = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) {
    document.getElementById('team-picker-grid').innerHTML =
      '<div class="loading">Could not load teams. Check your connection.</div>';
    return;
  }
  teams.sort((a,b) => (a.name || a.id).localeCompare(b.name || b.id));
  document.getElementById('team-picker-grid').innerHTML = teams.map(t => `
    <a class="team-card" href="team-chat.html?team=${encodeURIComponent(t.id)}">
      <div class="tlogo">${t.logo ? `<img src="${esc(t.logo)}" alt="">` : ''}</div>
      <div class="tname">${esc(t.name || t.id)}</div>
    </a>`).join('');
}

async function loadTeamAndChat(tid) {
  document.getElementById('chat-view').classList.remove('hidden');

  // Load team meta
  try {
    const snap = await getDocs(collection(db, 'teams'));
    const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    TEAM = all.find(t => t.id === tid);
    if (!TEAM) {
      document.getElementById('chat-wrap').innerHTML =
        `<div class="empty">Team "${esc(tid)}" not found. <a href="team-chat.html" style="color:var(--navy)">Pick another team</a>.</div>`;
      return;
    }
  } catch(e) {
    document.getElementById('chat-wrap').innerHTML =
      '<div class="empty">Could not load team data. Check your connection.</div>';
    return;
  }

  document.getElementById('team-name').textContent = TEAM.name || TEAM.id;
  document.getElementById('team-sub').textContent = 'Team Chat';
  if (TEAM.logo) {
    document.getElementById('team-logo').innerHTML = `<img src="${esc(TEAM.logo)}" alt="">`;
  }

  // Load roster for identity picker. Note: players collection uses `team`
  // (not team_id) and `num` (not jersey) — field names from the registration
  // flow.
  try {
    const q = query(collection(db, 'players'), where('team', '==', tid));
    const snap = await getDocs(q);
    ROSTER = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    ROSTER.sort((a,b) => {
      const ja = parseInt(a.num ?? 999), jb = parseInt(b.num ?? 999);
      if (ja !== jb) return ja - jb;
      return (a.name || '').localeCompare(b.name || '');
    });
  } catch(e) { ROSTER = []; }

  // Restore identity if we've been here before for this team
  try {
    const saved = localStorage.getItem('dvsl-chat-identity-' + tid);
    if (saved) IDENTITY = JSON.parse(saved);
  } catch(e) {}

  if (IS_ADMIN) {
    document.getElementById('reset-link').classList.remove('hidden');
  }

  // Password gate — uses the team's player_password (same one as the Player
  // Portal). Admin mode bypasses. A successful unlock persists in
  // localStorage so players don't have to re-enter every visit. Without this
  // gate, anyone with ?team=XXX could read a private team's chat.
  if (!passwordAccepted(tid)) {
    showPasswordGate(tid);
    return;
  }

  if (!IDENTITY) {
    showIdentityModal();
  } else {
    document.getElementById('me-name').textContent = IDENTITY.name;
    subscribeToMessages();
  }
}

function passwordAccepted(tid) {
  if (IS_ADMIN) return true;
  const stored = (TEAM?.player_password || TEAM?.password || '').trim();
  if (!stored) return true; // no password set on team = open access (legacy)
  return localStorage.getItem('dvsl-chat-pw-' + tid) === '1';
}

function showPasswordGate(tid) {
  const wrap = document.getElementById('chat-wrap');
  wrap.innerHTML = `
    <div style="max-width:380px;margin:40px auto;padding:28px 24px;background:var(--card);border:1px solid var(--border);border-radius:14px;text-align:center">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;text-transform:uppercase;color:var(--navy);margin-bottom:6px">
        Team Password Required
      </div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5">
        Ask your captain for the team password to join <strong>${esc(TEAM?.name || tid)}</strong>'s chat.
      </div>
      <input id="chat-pw-input" type="password" placeholder="Team password" autocomplete="off"
        style="width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:15px;margin-bottom:10px;text-align:center">
      <div id="chat-pw-error" style="display:none;color:var(--red);font-size:13px;margin-bottom:10px">Wrong password. Try again.</div>
      <button id="chat-pw-btn"
        style="width:100%;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer">
        Unlock Chat
      </button>
      <div style="margin-top:14px">
        <a href="team-chat.html" style="color:var(--muted);font-size:12px;text-decoration:none">← Pick a different team</a>
      </div>
    </div>`;
  const input = document.getElementById('chat-pw-input');
  const btn = document.getElementById('chat-pw-btn');
  const err = document.getElementById('chat-pw-error');
  const attempt = () => {
    const entered = (input.value || '').trim().toLowerCase();
    const stored = (TEAM?.player_password || TEAM?.password || '').trim().toLowerCase();
    if (entered && entered === stored) {
      localStorage.setItem('dvsl-chat-pw-' + tid, '1');
      // Restart the flow now that we've unlocked.
      location.reload();
    } else {
      err.style.display = 'block';
      input.value = '';
      input.focus();
    }
  };
  btn.addEventListener('click', attempt);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
  setTimeout(() => input.focus(), 60);
}

function showIdentityModal() {
  const modal = document.getElementById('identity-modal');
  const list = document.getElementById('roster-list');
  document.getElementById('identity-title').textContent =
    `Who are you? — ${TEAM?.name || TEAM?.id || 'Team'}`;

  if (!ROSTER.length) {
    list.innerHTML = '<div class="loading" style="padding:20px">No roster loaded. Type your name below.</div>';
  } else {
    list.innerHTML = ROSTER.map(p => `
      <div class="roster-item" data-pid="${esc(p.id)}">
        <span><span class="jersey">#${esc(p.num ?? '—')}</span> ${esc(p.name || p.id)}</span>
        <span style="color:var(--muted2);font-size:12px">›</span>
      </div>`).join('');
    list.querySelectorAll('.roster-item').forEach(row => {
      row.addEventListener('click', () => {
        const p = ROSTER.find(x => x.id === row.dataset.pid);
        if (p) savePlayerIdentity(p);
      });
    });
  }
  modal.classList.remove('hidden');
}

function savePlayerIdentity(player) {
  IDENTITY = {
    name: player.name || player.id,
    email: player.email || null,
    // Player docs seeded via firebase-add-rosters.html have a `captain:true`
    // flag on the captain's row. Honor it so pushes show the captain's name
    // alone instead of "TBI — Mark Schwartz".
    is_captain: !!player.captain,
    player_id: player.id,
  };
  localStorage.setItem('dvsl-chat-identity-' + teamId, JSON.stringify(IDENTITY));
  document.getElementById('identity-modal').classList.add('hidden');
  document.getElementById('me-name').textContent = IDENTITY.name;
  subscribeToMessages();
}

window.saveCustomIdentity = function() {
  const val = document.getElementById('custom-name-input').value.trim();
  if (!val) return;
  IDENTITY = { name: val, email: null, is_captain: false };
  localStorage.setItem('dvsl-chat-identity-' + teamId, JSON.stringify(IDENTITY));
  document.getElementById('identity-modal').classList.add('hidden');
  document.getElementById('me-name').textContent = IDENTITY.name;
  subscribeToMessages();
};

window.changeIdentity = function() {
  document.getElementById('identity-modal').classList.remove('hidden');
};

// ── Messages ─────────────────────────────────────────────────────────
function subscribeToMessages() {
  if (unsub) unsub();
  // limit(100) caps the initial fetch + listener billing.
  const q = query(
    collection(db, 'team_messages'),
    where('team_id', '==', teamId),
    orderBy('timestamp', 'asc'),
    limit(100)
  );
  unsub = onSnapshot(q, snap => {
    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderMessages(msgs);
  }, err => {
    console.error('Snapshot error:', err);
    document.getElementById('chat-wrap').innerHTML =
      `<div class="empty">Could not load messages: ${esc(err.message)}</div>`;
  });
}

function renderMessages(msgs) {
  const el = document.getElementById('chat-wrap');
  if (!msgs.length) {
    el.innerHTML = '<div class="empty">No messages yet. Start the conversation!</div>';
    MSG_CACHE = {};
    return;
  }
  MSG_CACHE = {};
  msgs.forEach(m => { MSG_CACHE[m.id] = m; });
  const myKey = IDENTITY?.email || IDENTITY?.name;
  el.innerHTML = msgs.map(m => {
    const authorKey = m.author_email || m.author_name || '';
    const mine = (IDENTITY?.email && m.author_email === IDENTITY.email) ||
                 (!IDENTITY?.email && m.author_name === IDENTITY?.name);
    const isCap = !!m.is_captain;
    const whoLabel = m.author_name || m.team_name || m.author_email || 'Unknown';
    const time = m.timestamp?.toDate ? fmtTime(m.timestamp.toDate()) : '';
    // Show delete button on own messages always, or on any message in admin mode
    const canDelete = mine || IS_ADMIN;
    const cls = [
      'msg',
      mine ? 'mine' : 'theirs',
      isCap && !mine ? 'captain' : '',
      !mine && IS_ADMIN ? 'can-delete' : '',
    ].filter(Boolean).join(' ');
    const whoClass = isCap ? 'who captain' : 'who';
    const delBtn = canDelete
      ? `<button class="del-btn" data-mid="${esc(m.id)}" title="Delete message" aria-label="Delete message">×</button>`
      : '';
    return `<div class="${cls}">
      ${!mine ? `<div class="${whoClass}">${esc(whoLabel)}</div>` : ''}
      <div class="bubble">${esc(m.text)}${delBtn}</div>
      <div class="time">${time}</div>
    </div>`;
  }).join('');
  // Wire delete buttons (event delegation is simpler here since re-rendered every snapshot)
  el.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      deleteMessage(btn.dataset.mid);
    });
  });
  // Auto-scroll to bottom on new messages
  el.scrollTop = el.scrollHeight;
}

async function deleteMessage(mid) {
  const m = MSG_CACHE[mid];
  if (!m) return;
  const preview = (m.text || '').slice(0, 60);
  if (!confirm(`Delete this message?\n\n"${preview}${m.text?.length > 60 ? '…' : ''}"`)) return;
  try {
    await deleteDoc(doc(db, 'team_messages', mid));
    // Cascade: clear matching pending_nav docs so the push disappears from
    // every recipient's bell panel too. Fire-and-forget — the message is
    // already gone from chat; worst case the push row lingers until the
    // 24h stale sweep runs.
    fetch('/api/delete-by-source', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': PUSH_SECRET },
      body: JSON.stringify({ sourceId: mid }),
    }).catch(() => {});
    // Snapshot listener will re-render automatically
  } catch(e) {
    alert('Could not delete: ' + e.message);
  }
}

// Admin-only: nuke every message in this team's chat. Batched in chunks of
// 400 to stay under Firestore's 500-ops batch limit, with a headroom margin.
window.resetChat = async function() {
  if (!IS_ADMIN) return;
  if (!confirm(`Reset the entire chat for ${TEAM?.name || teamId}?\n\nThis deletes ALL messages permanently. This cannot be undone.`)) return;
  if (!confirm('Are you absolutely sure? Last chance to back out.')) return;
  try {
    const q = query(collection(db, 'team_messages'), where('team_id', '==', teamId));
    const snap = await getDocs(q);
    if (!snap.docs.length) { alert('Chat is already empty.'); return; }
    let remaining = snap.docs.slice();
    while (remaining.length) {
      const chunk = remaining.splice(0, 400);
      const batch = writeBatch(db);
      chunk.forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
    alert(`Deleted ${snap.docs.length} message(s).`);
  } catch(e) {
    alert('Reset failed: ' + e.message);
  }
};

function fmtTime(d) {
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) {
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
         d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

// ── Send ─────────────────────────────────────────────────────────────
window.sendMessage = async function() {
  if (!IDENTITY) { showIdentityModal(); return; }
  const input = document.getElementById('msg-input');
  const btn = document.getElementById('send-btn');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.disabled = true;
  btn.disabled = true;

  try {
    const msgRef = await addDoc(collection(db, 'team_messages'), {
      text,
      author_email: IDENTITY.email || null,
      author_name: IDENTITY.name,
      is_captain: !!IDENTITY.is_captain,
      team_id: teamId,
      team_name: TEAM?.name || teamId,
      team_color: TEAM?.color || '#002D72',
      timestamp: serverTimestamp(),
    });

    // Fire push to opted-in team members (excluding this device).
    // Title format:
    //   Captain sending   → "Mark Schwartz"
    //   Player sending    → "TBI — Joe Smith"  (short team code, never full name)
    // sourceId = the new message's doc id; lets deleteMessage later clear the
    // matching bell-panel rows for everyone who received this push.
    try {
      const shortCode = TEAM?.short || teamId;
      const pushTitle = IDENTITY.is_captain
        ? IDENTITY.name
        : `${shortCode} — ${IDENTITY.name}`;
      await fetch('/api/send-notification', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': PUSH_SECRET },
        body: JSON.stringify({
          title: pushTitle,
          body: text.length > 120 ? text.slice(0, 120) + '…' : text,
          category: 'team_chat',
          team: teamId,
          url: `/team-chat.html?team=${encodeURIComponent(teamId)}`,
          sourceId: msgRef.id,
          excludeToken: localStorage.getItem('dvsl-notif-token') || undefined,
        }),
      });
    } catch(e) { console.warn('Push failed (message still delivered in-app):', e); }
  } catch(e) {
    alert('Failed to send: ' + e.message);
    input.value = text; // restore so the user doesn't lose their draft
  }

  input.disabled = false;
  btn.disabled = false;
  input.focus();
};
</script>
</body>
