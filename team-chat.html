<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#002D72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DVSL">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<!-- League config (must load before any page script or module) -->
<script src="/config.js"></script>
<script>
  // SW registration + bottom tab bar + "More" sheet.
  //
  // The app-shell pattern: every page (fan or role) shares a single
  // bottom tab bar on mobile (≤767px). Tabs navigate — tapping Inbox
  // goes to /inbox.html; tapping More opens a bottom-sheet list of
  // secondary destinations. On desktop the tab bar is hidden and the
  // page's own hamburger is used. On mobile the hamburger is hidden.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').then(r => { try { r.update(); } catch(_){} }).catch(() => {});
      let _dvslReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (_dvslReloaded) return;
        _dvslReloaded = true;
        window.location.reload();
      });
      navigator.serviceWorker.ready.then(r => {
        if (r.active) r.active.postMessage({ type: 'GET_VERSION' });
      }).catch(() => {});
      navigator.serviceWorker.addEventListener('message', (e) => {
        if (!e.data) return;
        if (e.data.type === 'VERSION' && typeof e.data.version === 'string') {
          // Only render the build tag on /rules.html, and only in the
          // normal document flow (not a fixed overlay). User wants a single
          // place to check which build is live without the chip cluttering
          // every page.
          if (location.pathname !== '/rules.html') return;
          let b = document.getElementById('dvsl-sw-version');
          if (!b) {
            b = document.createElement('div');
            b.id = 'dvsl-sw-version';
            b.style.cssText = 'text-align:center;padding:24px 0 8px;font:11px/1.2 ui-monospace,monospace;color:rgba(0,0,0,.35);user-select:none;';
            document.body.appendChild(b);
          }
          b.textContent = e.data.version;
        }
      });

      // ── Bottom tab bar + "More" sheet ─────────────────────────────
      // One shared set of inline SVG line icons for the bar + More sheet
      // (no emoji UI). Same 24x24 viewBox, stroke = currentColor so the
      // bar's grey / active-blue colours carry straight through. Keep this
      // map identical in every page that carries the bar.
      const DVSL_NAV_ICONS = {
        home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9"/>',
        ball: '<circle cx="12" cy="12" r="9"/><path d="M7.5 4.8c2 2 2.6 4.6 2 7.2-.5 2.5-1.6 4.6-3.6 6.2"/><path d="M16.5 4.8c-2 2-2.6 4.6-2 7.2.5 2.5 1.6 4.6 3.6 6.2"/>',
        calendar: '<rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/>',
        user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
        more: '<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/>',
        teams: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-.5A5.5 5.5 0 0 1 8 14h2a5.5 5.5 0 0 1 5.5 5.5v.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14a5 5 0 0 1 3.5 5v1"/>',
        standings: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M3 14.8h18M8.5 4v16"/>',
        stats: '<path d="M6 20v-7M12 20V4M18 20v-11"/>',
        leaders: '<circle cx="12" cy="9" r="6"/><path d="M8.6 14 7 22l5-3 5 3-1.6-8"/>',
        trophy: '<path d="M7 4h10v6a5 5 0 0 1-10 0V4z"/><path d="M17 6h3v1.5a3.5 3.5 0 0 1-3.2 3.5M7 6H4v1.5a3.5 3.5 0 0 0 3.2 3.5"/><path d="M12 15v4M8 20h8"/>',
        history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
        bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
        clipboard: '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M8.5 12h7M8.5 16h5"/>',
        pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
        shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
        camera: '<path d="M22 18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l2-3h6l2 3h3a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="3.5"/>',
        video: '<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4V8z"/>',
        rules: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
      };
      function _dvslNavIcon(key) {
        const body = DVSL_NAV_ICONS[key] || DVSL_NAV_ICONS.more;
        return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + body + '</svg>';
      }
      const TABS = [
        { id: 'home',     label: 'Home',     icon: 'home', href: '/' },
        { id: 'scores',   label: 'Scores',   icon: 'ball', href: '/#scores' },
        { id: 'schedule', label: 'Schedule', icon: 'calendar', href: '/#schedule' },
        { id: 'profile',  label: 'Profile',  icon: 'user', href: '/profile.html', badge: true },
        { id: 'more',     label: 'More',     icon: 'more',  more: true },
      ];
      // Every secondary destination lives here. Grouped for scanning.
      // Add/remove items here only — nothing else to edit downstream.
      const MORE_GROUPS = [
        {
          label: 'Compete',
          items: [
            { icon: 'standings', label: 'Standings',   href: '/#standings' },
            { icon: 'stats', label: 'Stats',       href: '/#stats' },
            { icon: 'leaders', label: 'Leaders',     href: '/#leaders' },
            { icon: 'trophy', label: 'Playoffs',    href: '/playoffs.html' },
            { icon: 'history', label: 'History',     href: '/#history' },
          ],
        },
        {
          label: 'Account',
          items: [
            { icon: 'user', label: 'My Profile',        href: '/profile.html' },
            { icon: 'bell', label: 'Notifications',     href: '/inbox.html' },
            { icon: 'clipboard', label: 'Captain Dashboard', href: '/captain.html' },
            { icon: 'pen', label: 'Player Sign-Up',    href: '/registration.html' },
            { icon: 'shield', label: 'Admin Access',      href: '/admin.html' },
          ],
        },
        {
          label: 'Content',
          items: [
            { icon: 'camera', label: 'Gallery',     href: '/photos.html' },
            { icon: 'video', label: 'Watch Live',  href: '/watch.html' },
            { icon: 'rules', label: 'Rules',       href: '/rules.html' },
          ],
        },
      ];

      // Figure out which tab (if any) is "active" for the current URL —
      // so the active tab gets highlighted on the bar.
      function _dvslCurrentTab() {
        const path = location.pathname.replace(/\/$/, '');
        const hash = location.hash || '';
        if (path === '/profile.html' || path === '/inbox.html') return 'profile';
        // Fan index: / and /index.html both count
        if (path === '' || path === '/index.html') {
          if (hash.startsWith('#scores'))   return 'scores';
          if (hash.startsWith('#schedule')) return 'schedule';
          if (hash === '' || hash === '#' || hash.startsWith('#home')) return 'home';
        }
        return null; // other pages → nothing lit up
      }

      function _dvslEnsureTabBar() {
        if (document.getElementById('dvsl-tabbar')) return;
        // Scoped CSS block — injected once on first build. Keeps all of
        // the tab-bar presentation here so individual pages don't need to
        // touch their own stylesheets.
        if (!document.getElementById('dvsl-tabbar-css')) {
          const st = document.createElement('style');
          st.id = 'dvsl-tabbar-css';
          st.textContent = `
          /* Tab bar lives on a <nav>, and most fan pages have global
             "nav { position:fixed; top:48px; ... }" rules that would otherwise
             hijack this element. !important overrides force our intent to win
             without having to touch every page's stylesheet. */
          #dvsl-tabbar {
            position: fixed !important;
            top: auto !important;
            right: auto !important;
            left: 50% !important;
            bottom: 0 !important;
            transform: translateX(-50%) !important;
            width: 100% !important;
            max-width: 480px !important;
            /* Taller bar + extra padding-bottom beyond safe-area so icons
               sit visibly higher off the physical bottom edge of the phone.
               Adam said v32's 68px/6px pad change wasn't enough — icons still
               felt like they were hugging the home-indicator. Here the inner
               content area gets 8px of top pad AND 14px of pad below the
               system safe-area, so icons float ~14px higher than before. */
            height: calc(56px + env(safe-area-inset-bottom)) !important;
            padding-top: 2px !important;
            padding-left: max(8px, env(safe-area-inset-left)) !important;
            padding-right: max(8px, env(safe-area-inset-right)) !important;
            padding-bottom: calc(env(safe-area-inset-bottom) + 6px) !important;
            margin: 0 !important;
            display: flex !important;
            align-items: stretch !important;
            justify-content: stretch !important;
            gap: 0 !important;
            background: #fff !important;
            border: 0 !important;
            border-top: 1px solid #e6e6e6 !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: 0 -4px 16px rgba(0,0,0,.06) !important;
            z-index: 99995 !important;
            box-sizing: border-box !important;
            font: 600 10px/1.1 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Inter,sans-serif !important;
          }
          #dvsl-tabbar > * {
            flex: 1 1 0; min-width: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 3px; padding: 4px 2px;
            background: transparent; border: 0;
            color: #8b8b8b; text-decoration: none; cursor: pointer;
            position: relative; -webkit-tap-highlight-color: transparent;
            overflow: visible;
            box-sizing: border-box;
            transition: color 160ms ease, transform 160ms ease;
          }
          /* Active tab: vivid blue, bolder label, STRONG glow on the icon.
             The old top-of-bar chip indicator has been removed — Adam said
             the line above the icon read awkwardly, and amping up the glow
             on the icon / label alone is a cleaner "this is where you are"
             cue. A layered drop-shadow gives the SVG icon a halo
             without needing extra DOM. */
          #dvsl-tabbar > *.active { color: #0057ff; }
          #dvsl-tabbar > *.active .dt-ico {
            filter: drop-shadow(0 0 2px rgba(0,87,255,.55)) drop-shadow(0 0 6px rgba(0,87,255,.35));
            transform: translateY(-1px) scale(1.1);
          }
          #dvsl-tabbar > *.active .dt-label {
            font-weight: 900 !important;
            letter-spacing: .05em !important;
            color: #0046B4 !important;
            text-shadow: 0 0 6px rgba(0,70,180,.35);
          }
          #dvsl-tabbar .dt-ico {
            height: 20px; display: flex; align-items: center; justify-content: center;
            transition: filter 160ms ease, transform 160ms ease;
          }
          #dvsl-tabbar .dt-label {
            font: 700 9.5px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif !important;
            letter-spacing: 0; text-transform: uppercase;
            white-space: nowrap;
            overflow: visible !important;
            text-align: center;
          }
          #dvsl-tabbar .dt-badge {
            position: absolute; top: 4px; right: calc(50% - 20px);
            background: #e53935; color: #fff;
            min-width: 16px; height: 16px; padding: 0 4px;
            border-radius: 8px; font: 700 10px/16px system-ui,sans-serif;
            text-align: center; display: none;
            box-shadow: 0 1px 3px rgba(0,0,0,.3);
          }
          #dvsl-more-backdrop {
            position: fixed; inset: 0; z-index: 99996;
            background: rgba(0,0,0,.32);
            opacity: 0; transition: opacity 150ms; touch-action: none;
          }
          #dvsl-more-sheet {
            position: fixed; left: 50%; bottom: 0;
            transform: translate(-50%, 100%);
            transition: transform 220ms cubic-bezier(.2,.8,.2,1);
            width: 100%; max-width: 480px;
            max-height: 82vh; display: flex; flex-direction: column;
            background: #fff;
            border-radius: 18px 18px 0 0;
            box-shadow: 0 -12px 40px rgba(0,0,0,.25);
            z-index: 99997;
            overflow: hidden;
            font: 500 15px/1.35 system-ui,-apple-system,Segoe UI,Inter,sans-serif;
            color: #111;
          }
          #dvsl-more-sheet.open { transform: translate(-50%, 0); }
          #dvsl-more-grab {
            flex: 0 0 auto; padding: 10px 0 4px; display: flex; justify-content: center;
          }
          #dvsl-more-grab::before {
            content: ''; width: 42px; height: 4px; background: #d4d4d4; border-radius: 2px;
          }
          #dvsl-more-head {
            flex: 0 0 auto; display: flex; align-items: center;
            padding: 4px 16px 10px;
          }
          #dvsl-more-head h3 {
            margin: 0; flex: 1; font: 700 18px/1.2 system-ui,sans-serif; color: #111;
          }
          #dvsl-more-close {
            background: transparent; border: 0; font: 400 26px/1 system-ui,sans-serif;
            color: #8b8b8b; cursor: pointer; padding: 4px 8px; margin: -4px -8px;
          }
          #dvsl-more-list {
            flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
          }
          .dvsl-more-group-label {
            font: 700 11px/1 system-ui,sans-serif; color: #888;
            text-transform: uppercase; letter-spacing: .1em;
            padding: 16px 18px 6px;
          }
          .dvsl-more-row {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px;
            color: #111; text-decoration: none;
            border-bottom: 1px solid #f3f3f3;
            -webkit-tap-highlight-color: rgba(0,45,114,.12);
          }
          .dvsl-more-row:active { background: #f5f7fb; }
          .dvsl-more-row .dmr-ico {
            flex: 0 0 auto; width: 28px; height: calc(22px * 1.35); display: flex; align-items: center; justify-content: center; color: #002D72;
          }
          .dvsl-more-row .dmr-lbl { flex: 1 1 auto; font-weight: 600; }
          .dvsl-more-row .dmr-chev { flex: 0 0 auto; color: #bbb; font-size: 18px; }
          /* Mobile-only display rules */
          @media (min-width: 768px) {
            #dvsl-tabbar { display: none !important; }
            body { padding-bottom: 0 !important; }
          }
          @media (max-width: 767px) {
            /* Hide the legacy hamburger on mobile — the tab bar replaces it. */
            .hamburger, #hbg, .menu-btn, .nav-toggle { display: none !important; }
          }
          `;
          document.head.appendChild(st);
        }

        const bar = document.createElement('nav');
        bar.id = 'dvsl-tabbar';
        bar.setAttribute('aria-label', 'Primary');
        const active = _dvslCurrentTab();
        TABS.forEach(t => {
          const el = t.more ? document.createElement('button') : document.createElement('a');
          el.dataset.tab = t.id;
          if (!t.more) { el.href = t.href; }
          if (t.id === active) el.classList.add('active');
          const ico = document.createElement('span'); ico.className = 'dt-ico'; ico.innerHTML = _dvslNavIcon(t.icon);
          const lbl = document.createElement('span'); lbl.className = 'dt-label'; lbl.textContent = t.label;
          el.appendChild(ico); el.appendChild(lbl);
          if (t.badge) {
            const bg = document.createElement('span');
            bg.className = 'dt-badge';
            bg.id = 'dvsl-tab-inbox-badge';
            el.appendChild(bg);
          }
          if (t.more) {
            el.type = 'button';
            el.setAttribute('aria-label', 'More destinations');
            el.addEventListener('click', (e) => { e.preventDefault(); _dvslOpenMore(); });
          }
          bar.appendChild(el);
        });
        document.body.appendChild(bar);

        // Keep the bar out of content. Padding is applied via JS so we can
        // respond to the media query without the CSS fighting page-level rules.
        _dvslApplyBodyPad();
      }

      function _dvslApplyBodyPad() {
        const mobile = window.matchMedia('(max-width: 767px)').matches;
        const hasTabBar = !!document.getElementById('dvsl-tabbar');
        if (mobile && hasTabBar) {
          // 74px bar + 8px top pad + 14px bottom pad + ~8px gap = 104px clearance.
          document.body.style.paddingBottom = 'calc(78px + env(safe-area-inset-bottom))';
        } else {
          document.body.style.paddingBottom = '';
        }
      }
      window.addEventListener('resize', _dvslApplyBodyPad);

      // Tab bar is built once at load, but the active-tab highlight
      // needs to react to client-side nav. Fan pages use location.hash
      // routing (goPage sets #scores / #schedule / #home etc.), and the
      // History API via goPage fires 'hashchange' or pushState which
      // doesn't, so we listen to both. User reported: tapping Scores /
      // Schedule kept Home glowing blue because this only ran at load.
      function _dvslSyncActiveTab() {
        const bar = document.getElementById('dvsl-tabbar');
        if (!bar) return;
        const active = _dvslCurrentTab();
        bar.querySelectorAll('[data-tab]').forEach(el => {
          if (el.dataset.tab === active) el.classList.add('active');
          else el.classList.remove('active');
        });
      }
      window.addEventListener('hashchange', _dvslSyncActiveTab);
      window.addEventListener('popstate', _dvslSyncActiveTab);
      // Also poll briefly after goPage-style navs (pushState doesn't fire
      // hashchange). Cheap enough — runs on any tab-bar click.
      document.addEventListener('click', (e) => {
        const a = e.target && e.target.closest && e.target.closest('#dvsl-tabbar [data-tab]');
        if (a) setTimeout(_dvslSyncActiveTab, 50);
      });

      // ── More sheet ────────────────────────────────────────────────
      let _dvslSavedScrollY = null;
      function _dvslLockBody() {
        if (_dvslSavedScrollY != null) return;
        _dvslSavedScrollY = window.scrollY || 0;
        document.body.style.position = 'fixed';
        document.body.style.top = '-' + _dvslSavedScrollY + 'px';
        document.body.style.left = '0';
        document.body.style.right = '0';
        document.body.style.width = '100%';
      }
      function _dvslUnlockBody() {
        if (_dvslSavedScrollY == null) return;
        const y = _dvslSavedScrollY;
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        document.body.style.width = '';
        _dvslSavedScrollY = null;
        window.scrollTo(0, y);
      }

      function _dvslOpenMore() {
        if (document.getElementById('dvsl-more-sheet')) return;
        _dvslLockBody();
        const backdrop = document.createElement('div');
        backdrop.id = 'dvsl-more-backdrop';
        backdrop.addEventListener('click', _dvslCloseMore);
        document.body.appendChild(backdrop);

        const sheet = document.createElement('div');
        sheet.id = 'dvsl-more-sheet';
        sheet.setAttribute('role', 'dialog');
        sheet.setAttribute('aria-label', 'More destinations');
        let html = '<div id="dvsl-more-grab"></div>' +
          '<div id="dvsl-more-head"><h3>More</h3><button id="dvsl-more-close" aria-label="Close">×</button></div>' +
          '<div id="dvsl-more-list">';
        MORE_GROUPS.forEach(g => {
          html += '<div class="dvsl-more-group-label">' + g.label + '</div>';
          g.items.forEach(it => {
            const safeLabel = String(it.label).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
            html += '<a class="dvsl-more-row" href="' + it.href + '">' +
              '<span class="dmr-ico">' + _dvslNavIcon(it.icon) + '</span>' +
              '<span class="dmr-lbl">' + safeLabel + '</span>' +
              '<span class="dmr-chev">›</span>' +
            '</a>';
          });
        });
        html += '</div>';
        sheet.innerHTML = html;
        document.body.appendChild(sheet);
        sheet.querySelector('#dvsl-more-close').addEventListener('click', _dvslCloseMore);
        // Close sheet on ANY row tap. For same-page hash routes (#standings,
        // #stats, etc.) the anchor only changes location.hash and doesn't
        // unload the page, so without this the sheet would stay mounted
        // covering the page the user just navigated to. Real-page hrefs
        // unload naturally; closing here is harmless in that case.
        sheet.querySelectorAll('.dvsl-more-row').forEach(row => {
          row.addEventListener('click', () => { _dvslCloseMore(); });
        });
        requestAnimationFrame(() => { backdrop.style.opacity = '1'; sheet.classList.add('open'); });
      }
      function _dvslCloseMore() {
        const b = document.getElementById('dvsl-more-backdrop');
        const s = document.getElementById('dvsl-more-sheet');
        if (s) s.classList.remove('open');
        if (b) b.style.opacity = '0';
        setTimeout(() => { if (s) s.remove(); if (b) b.remove(); _dvslUnlockBody(); }, 220);
      }

      // Build the tab bar ONLY when running as an installed PWA (home-
      // screen app). In regular Safari / Chrome we leave the page's own
      // hamburger menu in place — a phone-style tab bar at the bottom of
      // a browser tab looks out of place and fights the browser's own
      // toolbar for screen space.
      const _dvslIsPwa = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      if (_dvslIsPwa) _dvslEnsureTabBar();

      // ── Inbox badge polling (was the bell) ────────────────────────
      let _dvslLastCheck = 0;
      let _dvslLastCount = -1;

      async function _dvslCheckPendingNav() {
        const now = Date.now();
        if (now - _dvslLastCheck < 3000) return;
        _dvslLastCheck = now;
        const token = localStorage.getItem('dvsl-notif-token');
        if (!token) { _dvslSetBadge(0); return; }
        try {
          const resp = await fetch('/api/check-pending-nav', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token }),
          });
          if (!resp.ok) return;
          const data = await resp.json();
          const items = Array.isArray(data && data.items) ? data.items : [];
          // count is returned even when item contents need a sign-in.
          _dvslSetBadge(typeof (data && data.count) === 'number' ? data.count : items.length);
        } catch(_) {}
      }
      function _dvslSetBadge(count) {
        if (count === _dvslLastCount) return;
        _dvslLastCount = count;
        const el = document.getElementById('dvsl-tab-inbox-badge');
        if (!el) return;
        if (count > 0) {
          el.style.display = 'block';
          el.textContent = count > 99 ? '99+' : String(count);
        } else {
          el.style.display = 'none';
        }
      }

      _dvslCheckPendingNav();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') _dvslCheckPendingNav();
      });
      window.addEventListener('pageshow', _dvslCheckPendingNav);
      window.addEventListener('focus', _dvslCheckPendingNav);
      setInterval(() => {
        if (document.visibilityState === 'visible') _dvslCheckPendingNav();
      }, 5000);
    });
  }
</script>
<title>Team Chat — DVSL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f5;--card:#ffffff;--card2:#f8f8f8;--card3:#f0f0f0;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.15);
  --navy:#002D72;--navy-light:rgba(0,45,114,0.08);
  --white:#1a1a1a;--muted:rgba(0,0,0,0.5);--muted2:rgba(0,0,0,0.35);
  --red:#c8102e;--green:#22c55e;
}
html,body{height:100%}
html{background:#002D72}
body{background:var(--bg);color:var(--white);font-family:'Inter',sans-serif;line-height:1.6;display:flex;flex-direction:column}

/* Nav */
.nav{position:sticky;top:0;z-index:40;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,0.97);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top, 0px);box-sizing:content-box}
.nav-brand{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);text-decoration:none;display:flex;align-items:center;gap:8px}
.nav-back{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:6px}

/* Header card */
.team-hdr{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.team-hdr .logo{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;overflow:hidden}
.team-hdr .logo img{width:100%;height:100%;object-fit:contain}
.team-hdr .name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;letter-spacing:.02em;line-height:1}
.team-hdr .sub{font-size:12px;opacity:.85;margin-top:2px}
.team-hdr .me{margin-left:auto;font-size:11px;opacity:.85;text-align:right}
.team-hdr .me a{color:#fff;text-decoration:underline;cursor:pointer}

/* Messages list */
.chat-wrap{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg2)}
.msg{max-width:82%;display:flex;flex-direction:column;gap:2px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.theirs{align-self:flex-start;align-items:flex-start}
.msg .who{font-size:11px;font-weight:600;color:var(--muted);padding:0 4px}
.msg .who.captain{color:var(--navy)}
.msg .bubble{padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.45;word-wrap:break-word;white-space:pre-wrap;max-width:100%}
.msg.mine .bubble{background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.theirs .bubble{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.captain .bubble{background:#fff;border:1px solid rgba(0,45,114,.25);border-left:3px solid var(--navy)}
.msg .time{font-size:10px;color:var(--muted2);padding:0 4px}
.msg .bubble{position:relative}
.msg .del-btn{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;border:2px solid var(--bg2);font-size:12px;line-height:1;font-weight:700;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0}
.msg.mine .del-btn,.msg.can-delete .del-btn{display:flex}
.msg .del-btn:hover{transform:scale(1.1)}

/* Admin reset link */
.team-hdr .admin-actions{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;opacity:.85;text-align:right}
.team-hdr .admin-actions a{color:#fff;text-decoration:underline;cursor:pointer}
.team-hdr .admin-actions .reset-link{color:#ffb4b4}

.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:14px}
.load-older{align-self:center;margin:0 0 4px;padding:8px 16px;border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:18px;font-size:13px;font-weight:600;cursor:pointer}

/* Input row */
.input-row{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--border);position:sticky;bottom:0}
.input-row input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:22px;font-size:16px;outline:none;background:var(--card2)}
.input-row input:focus{border-color:var(--navy);background:#fff}
.input-row button{padding:0 20px;border:none;background:var(--navy);color:#fff;border-radius:22px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:14px;cursor:pointer}
.input-row button:disabled{opacity:.5;cursor:not-allowed}

/* Identity modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:400px;width:100%;padding:24px;max-height:85vh;overflow-y:auto}
.modal h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;margin-bottom:6px}
.modal p{font-size:13px;color:var(--muted);margin-bottom:16px}
.roster-list{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow-y:auto;margin-bottom:14px;border:1px solid var(--border);border-radius:8px;padding:6px}
.roster-item{padding:10px 12px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.roster-item:hover{background:var(--bg2)}
.roster-item .jersey{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--muted);font-size:13px;min-width:32px}
.custom-name{border-top:1px solid var(--border);padding-top:14px}
.custom-name label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.custom-name input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:16px}
.custom-name button{margin-top:10px;width:100%;padding:10px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer}

/* Team picker */
.team-picker{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.team-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 12px;text-align:center;cursor:pointer;text-decoration:none;color:var(--white);transition:all .15s}
.team-card:hover{border-color:var(--navy);box-shadow:0 2px 10px rgba(0,45,114,.1)}
.team-card .tlogo{width:48px;height:48px;margin:0 auto 8px;display:grid;place-items:center}
.team-card .tlogo img{width:100%;height:100%;object-fit:contain}
.team-card .tname{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em}

/* Misc */
.hidden{display:none!important}
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-brand">DVSL</a>
  <a href="index.html" class="nav-back">← Home</a>
</nav>

<!-- Team picker (shown when no ?team= param) -->
<div id="picker-view" class="hidden">
  <div style="padding:24px 20px 8px">
    <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;line-height:1;color:var(--navy);letter-spacing:-.01em">TEAM CHAT</div>
    <div style="font-size:13px;color:var(--muted);margin-top:4px">Pick your team to join the chat.</div>
  </div>
  <div id="team-picker-grid" class="team-picker">
    <div class="loading">Loading teams…</div>
  </div>
</div>

<!-- Chat view (shown when ?team= param present) -->
<div id="chat-view" class="hidden" style="flex:1;display:flex;flex-direction:column;min-height:0">
  <div class="team-hdr" id="team-hdr">
    <div class="logo" id="team-logo"></div>
    <div>
      <div class="name" id="team-name">Loading…</div>
      <div class="sub" id="team-sub">Team Chat</div>
    </div>
    <div class="me admin-actions">
      <div id="me-name">—</div>
      <div>
        <a id="switch-link" class="hidden" onclick="switchIdentity()">Switch</a>
        <a id="reset-link" class="reset-link hidden" onclick="resetChat()" style="margin-left:8px">Reset chat</a>
      </div>
    </div>
  </div>

  <div class="chat-wrap" id="chat-wrap">
    <div class="loading">Loading messages…</div>
  </div>

  <div class="input-row" id="input-row">
    <input id="msg-input" type="text" placeholder="Message your team…" maxlength="500" autocomplete="off"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
    <button onclick="sendMessage()" id="send-btn">Send</button>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import { getFirestore, collection, query, where, orderBy, limit, onSnapshot, addDoc, getDocs, getDoc, doc, deleteDoc, writeBatch, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';

const FIREBASE_CONFIG = window.LEAGUE_CONFIG.firebase;

const app = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(app);
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence).catch(()=>{});

// ── URL & state ──────────────────────────────────────────────────────
// Access is decided by the signed-in account's roles/{uid} doc (written
// only by the server): admins, captains of the team, and approved players
// on the team. The old ?admin=1 flag, team password and "Who are you?"
// picker are gone; people post as themselves.
const params = new URLSearchParams(location.search);
const teamId = params.get('team') || '';

// Clean up flags + picks left in localStorage by older builds.
try {
  localStorage.removeItem('dvsl-is-admin');
  Object.keys(localStorage).forEach(k => {
    if (k.indexOf('dvsl-chat-pw-') === 0 || k.indexOf('dvsl-chat-identity-') === 0) localStorage.removeItem(k);
  });
} catch(_) {}

let TEAM = null;
let ROSTER = [];
let ROSTER_BY_ID = {};
let ROLES = null;
let ME = null;            // Firebase user
let IDENTITIES = [];      // who this user may post as in this chat
let IDENTITY = null;      // { sender_id, name, is_captain }
let CAN_MODERATE = false; // captain of this team or admin
let unsub = null;
let MSG_CACHE = {}; // id → message doc (for delete lookup)
// Newest messages first from Firestore, shown oldest to newest. "Load older"
// grows the window by one page and re-subscribes.
const CHAT_PAGE = 100;
let chatLimit = CHAT_PAGE;
let keepScrollFrom = null; // scrollHeight before a "Load older" re-render

const esc = (s) => String(s ?? '').replace(/[&<>"'`]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
// Image URLs from Firestore: https:// or a same-site relative path only.
const safeImg = (u) => { const v = String(u ?? '').trim(); return (/^https:\/\//i.test(v) || /^\/?[A-Za-z0-9_.\-\/]+$/.test(v)) && !v.startsWith('//') ? v : ''; };

// First auth state (persistence restores the session asynchronously).
const AUTH_READY = new Promise(resolve => {
  let settled = false;
  onAuthStateChanged(auth, user => {
    if (settled) {
      // Signed in/out in another tab: re-run the access check.
      if ((user && user.uid) !== (ME && ME.uid) && teamId) location.reload();
      return;
    }
    settled = true;
    resolve(user || null);
  });
});

// POST to one of our /api endpoints with the user's ID token.
async function api(name, payload) {
  const headers = { 'Content-Type': 'application/json' };
  const u = auth.currentUser;
  if (u) headers.Authorization = 'Bearer ' + await u.getIdToken();
  const resp = await fetch('/api/' + name, { method: 'POST', headers, body: JSON.stringify(payload || {}) });
  let data = {};
  try { data = await resp.json(); } catch(_) {}
  if (!resp.ok || (data && data.error)) {
    const err = new Error((data && data.message) || ('Request failed (' + resp.status + ')'));
    err.code = data && data.error;
    err.status = resp.status;
    throw err;
  }
  return data || {};
}

// Link this device's push token to the signed-in account so team-chat
// pushes (delivered by auth_uid membership) reach it. Fire-and-forget,
// once per account per tab session; never blocks chat rendering.
function attachPushToken(user) {
  let token = null;
  try { token = localStorage.getItem('dvsl-notif-token'); } catch(_) {}
  if (!token || !user) return;
  const key = 'dvsl-notif-attached:' + user.uid;
  try { if (sessionStorage.getItem(key) === token) return; } catch(_) {}
  api('push-token', { action: 'attach', token })
    .then(() => { try { sessionStorage.setItem(key, token); } catch(_) {} })
    .catch(e => console.warn('token attach failed', e));
}

// Recompute roles on the server (self-heal), then read roles/{uid}.
async function loadRoles(user) {
  let fromServer = null;
  try {
    const d = await api('account', { action: 'refresh-roles' });
    fromServer = d && d.roles ? d.roles : null;
  } catch(e) { console.warn('refresh-roles failed:', e); }
  try {
    const snap = await getDoc(doc(db, 'roles', user.uid));
    if (snap.exists()) return snap.data() || {};
  } catch(e) { console.warn('roles read failed:', e); }
  return fromServer || {};
}

const arr = (v) => Array.isArray(v) ? v : [];
const teamLabel = () => TEAM?.short || TEAM?.name || teamId;

// ── Boot ─────────────────────────────────────────────────────────────
if (!teamId) {
  showTeamPicker();
} else {
  loadTeamAndChat(teamId);
}

async function showTeamPicker() {
  document.getElementById('picker-view').classList.remove('hidden');
  let teams = [];
  try {
    const snap = await getDocs(collection(db, 'teams'));
    teams = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(t => t.id !== '__playoff_brackets');
  } catch(e) {
    document.getElementById('team-picker-grid').innerHTML =
      '<div class="loading">Could not load teams. Check your connection.</div>';
    return;
  }
  teams.sort((a,b) => (a.name || a.id).localeCompare(b.name || b.id));
  document.getElementById('team-picker-grid').innerHTML = teams.map(t => `
    <a class="team-card" href="team-chat.html?team=${encodeURIComponent(t.id)}">
      <div class="tlogo">${safeImg(t.logo) ? `<img src="${esc(safeImg(t.logo))}" alt="">` : ''}</div>
      <div class="tname">${esc(t.name || t.id)}</div>
    </a>`).join('');
}

function setInputEnabled(on, placeholder) {
  const input = document.getElementById('msg-input');
  const btn = document.getElementById('send-btn');
  const row = document.getElementById('input-row');
  if (row) row.classList.toggle('hidden', !on && !placeholder);
  input.disabled = !on;
  btn.disabled = !on;
  input.placeholder = on ? 'Message your team…' : (placeholder || '');
}

// Shown when the visitor can't read this team's chat.
function showGate(kind, extra) {
  setInputEnabled(false);
  document.getElementById('me-name').textContent = '';
  const name = esc(TEAM?.name || teamId);
  let title, msg;
  if (kind === 'signin') {
    title = 'Sign In to Join the Chat';
    msg = `Team chat is for the players and captains of <strong>${name}</strong>. Sign in to your player profile or the captain portal, then come back here.`;
  } else if (kind === 'pending') {
    title = 'Waiting for Approval';
    msg = `Your captain still needs to approve you on <strong>${name}</strong>. You'll get team chat once you're approved.`;
  } else {
    title = 'Team Members Only';
    msg = `This chat is for the players and captains of <strong>${name}</strong>. If you play for ${name}, link your account on your player profile. Captains sign in on the captain portal.`;
  }
  const who = extra && extra.email ? `<div style="font-size:12px;color:var(--muted2);margin-top:10px">Signed in as ${esc(extra.email)}</div>` : '';
  const btn = 'display:block;width:100%;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:12px;font-family:\'Barlow Condensed\',sans-serif;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;margin-bottom:8px';
  document.getElementById('chat-wrap').innerHTML = `
    <div style="max-width:380px;margin:40px auto;padding:28px 24px;background:var(--card);border:1px solid var(--border);border-radius:14px;text-align:center">
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;text-transform:uppercase;color:var(--navy);margin-bottom:6px">${title}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5">${msg}</div>
      ${kind === 'pending' ? '' : `<a href="/profile.html" style="${btn}">Player sign in</a>
      <a href="/captain.html" style="${btn};background:#fff;color:var(--navy);border:1px solid var(--navy)">Captain portal</a>`}
      ${who}
      <div style="margin-top:14px">
        <a href="team-chat.html" style="color:var(--muted);font-size:12px;text-decoration:none">← Pick a different team</a>
      </div>
    </div>`;
}

async function loadTeamAndChat(tid) {
  document.getElementById('chat-view').classList.remove('hidden');
  setInputEnabled(false, 'Loading…');

  // Load team meta (public)
  try {
    const snap = tid === '__playoff_brackets' ? null : await getDoc(doc(db, 'teams', tid));
    TEAM = snap && snap.exists() ? { id: snap.id, ...snap.data() } : null;
    if (!TEAM) {
      setInputEnabled(false);
      document.getElementById('chat-wrap').innerHTML =
        `<div class="empty">Team "${esc(tid)}" not found. <a href="team-chat.html" style="color:var(--navy)">Pick another team</a>.</div>`;
      return;
    }
  } catch(e) {
    setInputEnabled(false);
    document.getElementById('chat-wrap').innerHTML =
      '<div class="empty">Could not load team data. Check your connection.</div>';
    return;
  }

  // Header shows the SHORT team code (e.g. "TBIR") rather than the full
  // name ("TBI Royals"). Adam asked for abbreviations in the team-chat
  // header across all teams — the full name still lives in hover/title
  // tooltips and on the team picker card.
  document.getElementById('team-name').textContent = TEAM.short || TEAM.name || TEAM.id;
  try { document.getElementById('team-name').title = TEAM.name || TEAM.id || ''; } catch(_) {}
  document.getElementById('team-sub').textContent = 'Team Chat';
  if (safeImg(TEAM.logo)) {
    document.getElementById('team-logo').innerHTML = `<img src="${esc(safeImg(TEAM.logo))}" alt="">`;
  }

  // Roster (public). Used to label messages with roster names. Note: the
  // players collection uses `team` (not team_id) and `num` (not jersey).
  try {
    const q = query(collection(db, 'players'), where('team', '==', tid));
    const snap = await getDocs(q);
    ROSTER = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) { ROSTER = []; }
  ROSTER_BY_ID = {};
  ROSTER.forEach(p => { ROSTER_BY_ID[p.id] = p; });

  // Who is this?
  ME = await AUTH_READY;
  if (!ME) { showGate('signin'); return; }
  ROLES = await loadRoles(ME);
  attachPushToken(ME);
  const isAdmin = ROLES.admin === true;
  const isCaptain = arr(ROLES.captain_teams).includes(tid);
  const isMember = arr(ROLES.member_teams).includes(tid);
  if (!isAdmin && !isCaptain && !isMember) {
    const pendingHere = ROSTER.some(p => p.auth_uid === ME.uid && p.pending_approval === true && p.active !== false);
    showGate(pendingHere ? 'pending' : 'member', { email: ME.email });
    return;
  }
  CAN_MODERATE = isAdmin || isCaptain;

  // Identities this account may post as here: the team (as captain) and
  // any approved, active roster row it owns on this team.
  IDENTITIES = [];
  if (isCaptain) {
    IDENTITIES.push({ sender_id: tid, name: teamLabel() + ' Captain', is_captain: true });
  }
  if (isMember) {
    const mine = arr(ROLES.player_ids);
    ROSTER.filter(p => (mine.includes(p.id) || p.auth_uid === ME.uid)
                       && p.active !== false && p.pending_approval !== true)
      .forEach(p => IDENTITIES.push({ sender_id: p.id, name: p.name || 'Player', is_captain: false }));
  }
  let pick = null;
  try {
    const savedAs = localStorage.getItem('dvsl-chat-as-' + tid);
    pick = IDENTITIES.find(i => i.sender_id === savedAs) || null;
  } catch(_) {}
  IDENTITY = pick || IDENTITIES[0] || null;

  if (CAN_MODERATE) document.getElementById('reset-link').classList.remove('hidden');
  document.getElementById('switch-link').classList.toggle('hidden', IDENTITIES.length < 2);
  renderIdentity();
  subscribeToMessages();
}

function renderIdentity() {
  const el = document.getElementById('me-name');
  if (IDENTITY) {
    el.textContent = 'Posting as ' + IDENTITY.name;
    setInputEnabled(true);
  } else {
    // Admin viewing another team's chat: read + moderate only.
    el.textContent = 'Commissioner view';
    setInputEnabled(false, 'Only this team\'s players and captains can post here');
  }
}

// Captains who are also on the roster can switch between posting as the
// team captain and as themselves.
window.switchIdentity = function() {
  if (IDENTITIES.length < 2) return;
  const i = IDENTITIES.indexOf(IDENTITY);
  IDENTITY = IDENTITIES[(i + 1) % IDENTITIES.length];
  try { localStorage.setItem('dvsl-chat-as-' + teamId, IDENTITY.sender_id); } catch(_) {}
  renderIdentity();
};

// ── Messages ─────────────────────────────────────────────────────────
function subscribeToMessages() {
  if (unsub) unsub();
  // Newest chatLimit messages (desc + limit), reversed for display, so new
  // messages always show up even once a team has more than one page.
  // Needs the composite index team_messages (team_id asc, timestamp desc).
  const q = query(
    collection(db, 'team_messages'),
    where('team_id', '==', teamId),
    orderBy('timestamp', 'desc'),
    limit(chatLimit)
  );
  unsub = onSnapshot(q, snap => {
    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse();
    renderMessages(msgs, snap.docs.length >= chatLimit);
  }, err => {
    console.error('Snapshot error:', err);
    document.getElementById('chat-wrap').innerHTML =
      `<div class="empty">Could not load messages: ${esc(err.message)}</div>`;
  });
}

// Display name for a message, always from league data (roster name or the
// team name for captain posts), never the free-text name a client sent.
function whoLabelFor(m) {
  if (m.is_captain && (!m.sender_id || m.sender_id === teamId)) return teamLabel() + ' Captain';
  if (m.sender_id) {
    const p = ROSTER_BY_ID[m.sender_id];
    return p ? (p.name || 'Player') : 'Former player';
  }
  // Legacy messages (before sign-in was required) only carry a typed name.
  // Show it only when it matches a roster name exactly.
  const legacy = String(m.author_name || '').replace(/\s*\(captain\)\s*$/i, '').trim().toLowerCase();
  const hit = legacy && ROSTER.find(p => String(p.name || '').trim().toLowerCase() === legacy);
  return hit ? hit.name : 'Teammate';
}

window.loadOlderMessages = function() {
  const el = document.getElementById('chat-wrap');
  keepScrollFrom = el ? el.scrollHeight - el.scrollTop : null;
  chatLimit += CHAT_PAGE;
  subscribeToMessages();
};

function renderMessages(msgs, hasOlder) {
  const el = document.getElementById('chat-wrap');
  if (!msgs.length) {
    el.innerHTML = '<div class="empty">No messages yet. Start the conversation!</div>';
    MSG_CACHE = {};
    return;
  }
  MSG_CACHE = {};
  msgs.forEach(m => { MSG_CACHE[m.id] = m; });
  const myUid = ME?.uid || '';
  const olderBtn = hasOlder ? '<button type="button" class="load-older" id="load-older-btn">Load older messages</button>' : '';
  el.innerHTML = olderBtn + msgs.map(m => {
    const mine = !!myUid && m.sender_uid === myUid;
    const isCap = !!m.is_captain;
    const whoLabel = whoLabelFor(m);
    const time = m.timestamp?.toDate ? fmtTime(m.timestamp.toDate()) : '';
    // Delete: your own messages, or any message for captains/admin.
    const canDelete = mine || CAN_MODERATE;
    const cls = [
      'msg',
      mine ? 'mine' : 'theirs',
      isCap && !mine ? 'captain' : '',
      !mine && CAN_MODERATE ? 'can-delete' : '',
    ].filter(Boolean).join(' ');
    const whoClass = isCap ? 'who captain' : 'who';
    const delBtn = canDelete
      ? `<button class="del-btn" data-mid="${esc(m.id)}" title="Delete message" aria-label="Delete message">×</button>`
      : '';
    return `<div class="${cls}">
      ${!mine ? `<div class="${whoClass}">${esc(whoLabel)}</div>` : ''}
      <div class="bubble">${esc(m.text)}${delBtn}</div>
      <div class="time">${esc(time)}</div>
    </div>`;
  }).join('');
  // Wire delete buttons (event delegation is simpler here since re-rendered every snapshot)
  el.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      deleteMessage(btn.dataset.mid);
    });
  });
  const ob = document.getElementById('load-older-btn');
  if (ob) ob.addEventListener('click', () => window.loadOlderMessages());
  if (keepScrollFrom != null) {
    // After "Load older": keep the reader where they were.
    el.scrollTop = el.scrollHeight - keepScrollFrom;
    keepScrollFrom = null;
    return;
  }
  // Auto-scroll to bottom on new messages
  el.scrollTop = el.scrollHeight;
}

async function deleteMessage(mid) {
  const m = MSG_CACHE[mid];
  if (!m) return;
  const preview = (m.text || '').slice(0, 60);
  if (!confirm(`Delete this message?\n\n"${preview}${m.text?.length > 60 ? '…' : ''}"`)) return;
  try {
    // The server checks who may delete (sender_uid, team captain, admin),
    // deletes the message and clears its pushes from every recipient's
    // inbox (pending_nav). Only fall back to a client delete when the server
    // says it didn't delete the message.
    const r = await api('delete-by-source', { collection: 'team_messages', id: mid });
    if (!(r && r.messageDeleted)) await deleteDoc(doc(db, 'team_messages', mid));
    // Snapshot listener will re-render automatically
  } catch(e) {
    alert('Could not delete: ' + e.message);
  }
}

// Captains/admin: delete every message in this team's chat. Batched in
// chunks of 10: each rule-checked delete reads roles/{uid}, and Firestore
// caps document-access calls per request, so big batches fail outright.
window.resetChat = async function() {
  if (!CAN_MODERATE) return;
  if (!confirm(`Reset the entire chat for ${TEAM?.name || teamId}?\n\nThis deletes ALL messages permanently. This cannot be undone.`)) return;
  if (!confirm('Are you absolutely sure? Last chance to back out.')) return;
  try {
    const q = query(collection(db, 'team_messages'), where('team_id', '==', teamId));
    const snap = await getDocs(q);
    if (!snap.docs.length) { alert('Chat is already empty.'); return; }
    let remaining = snap.docs.slice();
    while (remaining.length) {
      const chunk = remaining.splice(0, 10);
      const batch = writeBatch(db);
      chunk.forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
    alert(`Deleted ${snap.docs.length} message(s).`);
  } catch(e) {
    alert('Reset failed: ' + e.message);
  }
};

function fmtTime(d) {
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) {
    return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
         d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

// ── Send ─────────────────────────────────────────────────────────────
window.sendMessage = async function() {
  if (!IDENTITY || !ME) return;
  const input = document.getElementById('msg-input');
  const btn = document.getElementById('send-btn');
  const text = input.value.trim().slice(0, 2000);
  if (!text) return;
  input.value = '';
  input.disabled = true;
  btn.disabled = true;

  try {
    const msgRef = await addDoc(collection(db, 'team_messages'), {
      team_id: teamId,
      text,
      sender_uid: ME.uid,
      sender_id: IDENTITY.sender_id,
      // rules: sender_name is a short string (≤ 80, no < or >); display
      // always uses the roster name, this is only a hint for old clients.
      sender_name: String(IDENTITY.name || '').replace(/[<>]/g, '').slice(0, 80),
      is_captain: !!IDENTITY.is_captain,
      timestamp: serverTimestamp(),
    });

    // Push to this team's subscribers (excluding this device). The server
    // checks the sender's roles and may rewrite the title.
    // sourceId = the new message's doc id; lets deleteMessage later clear the
    // matching bell-panel rows for everyone who received this push.
    try {
      const pushTitle = IDENTITY.is_captain
        ? `${teamLabel()} Captain`
        : `${teamLabel()} — ${IDENTITY.name}`;
      await api('send-notification', {
        title: pushTitle,
        body: text.length > 120 ? text.slice(0, 120) + '…' : text,
        category: 'team_chat',
        teams: [teamId],
        url: `/team-chat.html?team=${encodeURIComponent(teamId)}`,
        sourceId: msgRef.id,
        excludeToken: localStorage.getItem('dvsl-notif-token') || undefined,
      });
    } catch(e) { console.warn('Push failed (message still delivered in-app):', e); }
  } catch(e) {
    alert('Failed to send: ' + e.message);
    input.value = text; // restore so the user doesn't lose their draft
  }

  input.disabled = false;
  btn.disabled = false;
  input.focus();
};
</script>
